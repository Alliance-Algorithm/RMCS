# Research parameter fragment. No hardware component is started by this file.
# Append the new component to the existing traditional graph; see
# docs/zh-cn/wheel_leg_self_righting_v202.md. The native Isaac runner calls the
# same C++ core without starting ROS or any vehicle process.
rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::controller::wheelleg::WheelLegSelfRightingController -> wheelleg_self_righting
wheelleg_self_righting:
  ros__parameters:
    enabled: false
    simulation_only: true
    hardware_mapping_verified: false
    handoff_enabled: true
    motor_velocity_servo: true
    dt: 0.001
    arm_dwell_seconds: 1.0
    # Select a measured-pose route. Requires MIDDLE/UP wheel permission;
    # both-MIDDLE holds recovery ownership at zero effort until then.
    pose_routes_enabled: true
    route_tuck_knee_deg: 45.0
    route_support_knee_deg: 105.0
    route_landing_knee_deg: 48.0
    route_landing_orbit_deg: 20.0
    route_support_orbit_deg: 95.0
    route_side_stroke_deg: 80.0
    route_upright_dwell_seconds: 0.08
    route_upright_gyro_rad_s: 2.0
    route_plant_wheel_assist_nm: 0.6
    # q_CAD = sign*q_API + offset. These identity values are for CAD-frame
    # simulation input only; they are not a measured hardware calibration.
    cad_axis_sign: [1.0, 1.0, 1.0, 1.0]
    cad_axis_offset_rad: [0.0, 0.0, 0.0, 0.0]
    speed_limit_rad_s: 3.14
    cruise_speed_rad_s: 1.5
    acceleration_rad_s2: 3.0
    velocity_gain: 5.0
    position_gain: 12.0
    integral_gain: 50.0
    integral_limit_nm: 30.0
    torque_limit_nm: 40.0
    timeout_seconds: 30.0
    fold_knee_deg: 75.0
    flip_knee_deg: 55.0
    flip_orbit_deg: 0.0
    sweep_orbit_deg: 180.0
    flip_asymmetry_knee_deg: 0.0
    # Optional rows: knee lower/upper, orbit lower/upper (degrees), speed,
    # acceleration, hold seconds, physical left/right wheel velocities.
    # Used when pose_routes_enabled is false (legacy research comparison).
    flip_program: []
    flip_program_relative_to_side: true
    balance_wheel_speed_limit_rad_s: 40.0
    balance_distance_gain: 0.98
    flip_capture_tilt_deg: 31.788330617
    flip_capture_gyro_rad_s: 2.0
    flip_capture_dwell_seconds: 0.0
    flip_fold_first: false
    flip_handoff_orbit_limit_deg: 0.0
    flip_balance_when_upright: false
    # Optional simulation search: abandon a stopped, blocked Flip waypoint.
    # This is not contact detection or successful arrival. Zero disables it.
    flip_stall_dwell_seconds: 0.0
    # Bits 1/2 keep the first/second program leg at its own initial orbit in row 0.
    # The knee target still follows the program; leg order follows flip_program_relative_to_side.
    flip_first_orbit_hold_mask: 0
    pitch_trim_gain: 0.0
    yaw_rate_gain: 0.6
    balance_kp: 35.0
    balance_kd: 5.0
    balance_kv: 5.2
    support_gain: 1.0
