rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::WheelLeg -> wheel_leg
      - rmcs_core::controller::chassis::WheelLegReferenceController -> wheel_leg_reference_controller
      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

wheel_leg:
  ros__parameters:
    board_serial: ""
    require_enable_request: true
    joint_control_mode: "position_pd"
    joint_position_kp: 30.0
    joint_position_kd: 1.0
    dm_master_ids: [1, 2, 1, 2]
    dm_mit_position_max: [12.5, 12.5, 12.5, 12.5]
    dm_mit_velocity_max: [45.0, 45.0, 45.0, 45.0]
    dm_mit_torque_max: [54.0, 54.0, 54.0, 54.0]
    dm_control_torque_max: [40.0, 40.0, 40.0, 40.0]

wheel_leg_reference_controller:
  ros__parameters:
    # All four DM drives were zeroed at the 105-degree mechanical reference pose.
    # These are motor API targets, not URDF assembly or policy nominal joint angles.
    # Order: left hip, left knee drive, right hip, right knee drive.
    reference_motor_angles: [0.0, 0.0, 0.0, 0.0]

value_broadcaster:
  ros__parameters:
    update_rate: 50.0
    forward_list:
      - /wheel_leg/reference/state
      - /wheel_leg/imu/sensor_gravity/x
      - /wheel_leg/imu/sensor_gravity/y
      - /wheel_leg/imu/sensor_gravity/z
      - /wheel_leg/imu/sensor_gyro/x
      - /wheel_leg/imu/sensor_gyro/y
      - /wheel_leg/imu/sensor_gyro/z
      - /wheel_leg/left_hip_joint/angle
      - /wheel_leg/left_knee_joint/angle
      - /wheel_leg/right_hip_joint/angle
      - /wheel_leg/right_knee_joint/angle
      - /wheel_leg/left_hip_joint/velocity
      - /wheel_leg/left_knee_joint/velocity
      - /wheel_leg/right_hip_joint/velocity
      - /wheel_leg/right_knee_joint/velocity
      - /wheel_leg/left_hip_joint/control_torque
      - /wheel_leg/left_knee_joint/control_torque
      - /wheel_leg/right_hip_joint/control_torque
      - /wheel_leg/right_knee_joint/control_torque
      - /wheel_leg/left_hip_joint/control_angle
      - /wheel_leg/left_knee_joint/control_angle
      - /wheel_leg/right_hip_joint/control_angle
      - /wheel_leg/right_knee_joint/control_angle
