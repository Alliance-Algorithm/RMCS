# Supervised V6 real-robot recovery commissioning.
# Fresh double DOWN -> double MIDDLE starts the native script, then RL takeover.
# Uses the user-confirmed dev/rmcs_rl wiring/zeros and the 107..108-degree stop.
# This enables the current ground test; it is not qualification of every fallen pose.
rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::WheelLeg -> wheel_leg
      - rmcs::rl::RlController -> rl_controller
      - rmcs_core::controller::chassis::WheelLegChassisController -> wheel_leg_chassis_controller
      - rmcs_core::controller::identification::WheelLegIdentificationRecorder -> wheel_leg_identification_recorder

      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

value_broadcaster:
  ros__parameters:
    update_rate: 50.0
    forward_list:
      # 右腿（髋/膝/轮）
      - /wheel_leg/right_hip_joint/angle
      - /wheel_leg/right_hip_joint/velocity
      - /wheel_leg/right_hip_joint/torque
      - /wheel_leg/right_knee_joint/angle
      - /wheel_leg/right_knee_joint/velocity
      - /wheel_leg/right_knee_joint/torque
      - /wheel_leg/right_wheel/angle
      - /wheel_leg/right_wheel/velocity
      - /wheel_leg/right_wheel/torque

      - /wheel_leg/feedback_fresh
      - /wheel_leg/dr16_fresh
      - /remote/rotary_knob
      - /chassis/control_height
      - /wheel_leg/dm_control_ready
      - /wheel_leg/enable_request
      - /wheel_leg/imu/sensor_gravity/x
      - /wheel_leg/imu/sensor_gravity/y
      - /wheel_leg/imu/sensor_gravity/z
      - /wheel_leg/imu/sensor_gyro/x
      - /wheel_leg/imu/sensor_gyro/y
      - /wheel_leg/imu/sensor_gyro/z
      - /wheel_leg/left_hip_joint/control_torque
      - /wheel_leg/left_knee_joint/control_torque
      - /wheel_leg/right_hip_joint/control_torque
      - /wheel_leg/right_knee_joint/control_torque
      - /wheel_leg/left_wheel/control_torque
      - /wheel_leg/right_wheel/control_torque

      # 左腿（髋/膝/轮）
      - /wheel_leg/left_hip_joint/angle
      - /wheel_leg/left_hip_joint/velocity
      - /wheel_leg/left_hip_joint/torque
      - /wheel_leg/left_knee_joint/angle
      - /wheel_leg/left_knee_joint/velocity
      - /wheel_leg/left_knee_joint/torque
      - /wheel_leg/left_wheel/angle
      - /wheel_leg/left_wheel/velocity
      - /wheel_leg/left_wheel/torque

      - /wheel_leg/rl/state
      - /wheel_leg/rl/recovery/phase
      - /wheel_leg/rl/recovery/failure
      - /wheel_leg/rl/recovery/native_phase
      - /wheel_leg/rl/recovery/native_route
      - /wheel_leg/rl/recovery/native_failure
      - /wheel_leg/rl/recovery/native_motion_released
      - /wheel_leg/rl/recovery/sensors_valid
      - /wheel_leg/rl/recovery/sensor_issue
      - /wheel_leg/rl/recovery/sensor_invalid_mask
      - /wheel_leg/rl/recovery/motor_age_ms
      - /wheel_leg/rl/recovery/imu_age_ms
      - /wheel_leg/rl/recovery/acceleration_age_ms
