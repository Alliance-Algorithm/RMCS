rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::MotorPosition -> motor_hardware
      - rmcs_core::controller::pid::ErrorPidController -> motor_angle_pid
      - rmcs_core::controller::pid::PidController -> motor_velocity_pid
      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

motor_hardware:
  ros__parameters:
    board_serial: ""
    filter_alpha: 0.18
    square_wave: false
    square_low: 0.0
    square_high: 1.5707963
    square_period: 2.0   
    sequence_wave: true
    sequence_angles: [
      0.0,            
      0.785398,       
      1.570796,       
      2.50,           
      1.570796,       
      0.0,           
      -1.570796,      
      -2.50,          
      -1.570796,      
      0.0
    ]            
    sequence_dwell: 3.5  

motor_angle_pid:
  ros__parameters:
    measurement: /motor/angle_error
    control: /motor/control_velocity
    kp: 13.0
    ki: 0.0
    kd: 0.0
    output_min: -7.0
    output_max: 7.0

motor_velocity_pid:
  ros__parameters:
    measurement: /motor/velocity
    setpoint: /motor/control_velocity
    control: /motor/control_torque
    kp: 0.42
    ki: 0.002
    kd: 0.0
    output_min: -3.0
    output_max: 3.0

value_broadcaster:
  ros__parameters:
    forward_list:
      - /motor/angle
      - /motor/angle_single_turn
      - /motor/velocity
      - /motor/control_angle
      - /motor/angle_error
      - /motor/control_velocity
      - /motor/velocity_filtered
      - /motor/control_torque
