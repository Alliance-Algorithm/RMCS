rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::MotorPosition -> motor_hardware
      # 外环：角度 PID（最短弧角度误差 -> 目标角速度）
      - rmcs_core::controller::pid::ErrorPidController -> motor_angle_pid
      # 内环：速度 PID（目标角速度 -> 力矩）
      - rmcs_core::controller::pid::PidController -> motor_velocity_pid
      # 把内部接口发布成 ROS topic，供 Foxglove 看波形
      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

motor_hardware:
  ros__parameters:
    board_serial: ""
    # 内环速度反馈一阶低通滤波器的平滑系数（0~1，越大越不滤波）
    filter_alpha: 0.18
    # 可选：初始目标角度(rad)。不设则等 /motor/target_angle 话题
    # initial_angle: 1.5707963
    # 位置方形波（仅用于调双环 PID）：true 时目标角度在 square_high/square_low 间切换
    square_wave: false
    square_low: 0.0
    square_high: 1.5707963
    square_period: 2.0   # 每个半周期时长（秒）：1.0 = 1s到高 + 1s到低
    # 位置序列（测试用）：依次走 sequence_angles，每个停 sequence_dwell 秒。优先级高于 square_wave
    sequence_wave: true
    sequence_angles: [0.0, 0.785398163, 1.5707963, -1.5707963, 0.0]
    sequence_dwell: 2.0  # 每个角度停留秒数

motor_angle_pid:
  ros__parameters:
    # 外环测量：硬件算好的"最短弧"角度误差(rad)
    measurement: /motor/angle_error
    # 外环输出：内环的目标角速度
    control: /motor/control_velocity
    # M3508（内置减速 3591/187）输出转速上限约 2.5 rad/s，限幅先按这个收
    # 角度误差~1.57rad 时 kp=3 -> 目标速度饱和到 ±2.5，电机才会动
    kp: 6.5
    ki: 0.0
    kd: 0.0
    output_min: -6.0
    output_max: 6.0

motor_velocity_pid:
  ros__parameters:
    # 内环测量：滤波后的实际转速(rad/s)
    measurement: /motor/velocity_filtered
    setpoint: /motor/control_velocity
    control: /motor/control_torque
    # M3508 输出最大力矩约 6 N·m，先给偏保守的限幅再调
    kp: 0.42
    ki: 0.0015
    kd: 0.0
    output_min: -3.0
    output_max: 3.0

value_broadcaster:
  ros__parameters:
    # std_msgs/msg/Float64 主题，Foxglove 订阅画波形
    forward_list:
      - /motor/angle
      - /motor/velocity
      - /motor/control_angle
      - /motor/angle_error
      - /motor/control_velocity
      - /motor/velocity_filtered
      - /motor/control_torque
