rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:

      # - rmcs_core::hardware::TEST ->test
      # - rmcs_core::controller::arm::G6618TestController -> g6618_test_controller

      # - rmcs::AutoAimPlayerComponent -> auto_aim_player
      # - rmcs::AutoAimVideoPlayerComponent -> auto_aim_video_player
      # - rmcs::AutoAimRecorderComponent -> auto_aim_recorder
      # - rmcs_core::controller::arm::ArmVisual -> arm_visual
      

      # - rmcs::AutoAimCapturerComponent -> auto_aim_capturer
      - rmcs::RealSenseCapturerComponent -> realsense_capturer
      - rmcs::AutoMineComponent -> auto_mine_component

      # - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

test:
  ros__parameters:
    board_serial_arm_board: ""

auto_aim_capturer:
  ros__parameters:
    camera_name: ""
    exposure_us: 4000.0
    gain: 8.0
    framerate: 120.0
    invert_image: false
    rls_tau_sec: 10.0
    use_hardware_sync: false
    delay_ms: 6.5

realsense_capturer:
  ros__parameters:
    serial_number: ""
    exposure_us: -1.0
    gain: 64.0
    framerate: 30
    delay_ms: 0.0
    frame_topic: "/visual_mining/rgbd_frame"
    imu_snapshot_topic: ""

auto_mine_component:
  ros__parameters:
    # 输入帧 topic，需与 RealSenseCapturerComponent 的 frame_topic 一致
    frame_topic: "/visual_mining/rgbd_frame"
    camera_translation: [0.0, 0.0, 0.0]


value_broadcaster:
  ros__parameters:
    forward_list:
      - "/arm/motor/torque"
      - "/arm/motor/angle"
      - "/arm/motor/velocity"
