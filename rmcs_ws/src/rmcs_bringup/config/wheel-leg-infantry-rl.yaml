rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::WheelLegInfantryRL -> wheel_leg_infantry_rl
      - rmcs::rl::RlController -> rl_controller
      - rmcs_core::controller::chassis::WheelLegChassisController -> wheel_leg_chassis_controller

      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

value_broadcaster:
  ros__parameters:
    update_rate: 50.0
    forward_list:
      # 右腿（髋/膝/轮）
      - /wheel_leg/right_hip_joint/angle
      - /wheel_leg/right_hip_joint/velocity
      - /wheel_leg/right_hip_joint/torque
      - /wheel_leg/right_knee_joint/angle
      - /wheel_leg/right_knee_joint/velocity
      - /wheel_leg/right_knee_joint/torque
      - /wheel_leg/right_wheel/angle
      - /wheel_leg/right_wheel/velocity
      - /wheel_leg/right_wheel/torque

      # 左腿（髋/膝/轮）
      - /wheel_leg/left_hip_joint/angle
      - /wheel_leg/left_hip_joint/velocity
      - /wheel_leg/left_hip_joint/torque
      - /wheel_leg/left_knee_joint/angle
      - /wheel_leg/left_knee_joint/velocity
      - /wheel_leg/left_knee_joint/torque
      - /wheel_leg/left_wheel/angle
      - /wheel_leg/left_wheel/velocity
      - /wheel_leg/left_wheel/torque

wheel_leg_infantry_rl:
  ros__parameters:
    board_serial: ""

    hip_kp: 200.0
    hip_kd: 4.0
    knee_kp: 200.0
    knee_kd: 4.0

rl_controller:
  ros__parameters:
    rl_model_path: "models/wheel_leg_V1.onnx"   # 训练导出（obs[1,28] -> actions[1,6] float32）
    rl_inference_frequency: 50.0            # 推理频率（训练控制频率 = sim dt 0.005 × decimation 4）
    rl_publish_network_io: true             # 发布观测/动作调试输出

    joint_names: [left_hip_joint, left_knee_joint, left_wheel, right_hip_joint, right_knee_joint, right_wheel]
    joint_base_path: "/wheel_leg"
    position_pd_joints: [0, 1, 3, 4]        # 位置 PD 组（腿）
    velocity_pd_joints: [2, 5]              # 速度 PD 组（轮；其位置观测在 obs 中置零）
    position_group_angle_suffix: "/solved_angle"
    position_group_velocity_suffix: "/solved_velocity"
    rl_obs_size: 28                         # 默认 10+3N；与模型一致
    rl_action_size: 6

    default_dof_pos: [-0.5, -0.35, 0.0, 0.5, 0.35, 0.0]
    dof_pos_limits_lower: [-100.0, -0.9, -100.0, -100.0, -0.65, -100.0]   # 训练 URDF 限位
    dof_pos_limits_upper: [100.0, 0.65, 100.0, 100.0, 0.9, 100.0]
    position_action_scale: 0.5
    velocity_action_scale: 10.0
    max_velocity: 100.0
    velocity_torque_max: 6.0                # 训练 clamp（轮端，含 16.33 减速箱时按实际校核）
    position_kp: 200.0                      # 训练 PD（sim 值，部署保持一致）
    position_kd: 4.0
    velocity_kp: 20.0
    velocity_kd: 0.5
    position_torque_max: 35.0               # 髋输出限幅（参照 XYEGA ±35Nm）
    position_pd_on_motor: true

    obs_ang_vel_scale: 0.5
    obs_gravity_scale: 1.0
    obs_dof_pos_scale: 1.0
    obs_dof_vel_scale: 0.1
    obs_height_scale: 5.0
    clip_observations: 100.0
    clip_actions: 100.0

    motion_linear_x_min: -2.5
    motion_linear_x_max: 2.5
    motion_angular_z_min: -3.0
    motion_angular_z_max: 3.0
    command_height_min: 0.20
    command_height_max: 0.42
    default_command_height: 0.22

    auto_enter_rl: false                    # 调试期保持 false，遥控 state=3 手动进 RL
    prepare_dof_pos: [-0.5, -0.35, 0.5, 0.35]   # 站立预备位（腿序 left_hip,left_knee,right_hip,right_knee）
    prepare_kp: 80.0
    prepare_kd: 2.0
    prepare_max_velocity: 1.0               # 插值速度上限 rad/s
    prepare_reach_threshold: 0.02

wheel_leg_chassis_controller:
  ros__parameters:
    arm_switch: "left"                      # 武装拨杆（左/右拨杆三档）
    vx_max: 2.5                             # 与 rl_controller motion_linear_x_max 一致
    yaw_rate_max: 3.0                       # 与 rl_controller motion_angular_z_max 一致
    deadzone: 0.08
    command_height_min: 0.20                # 与 rl_controller command_height_* 一致
    command_height_max: 0.42
    default_command_height: 0.22
    height_range: 0.20                      # 左杆 Y 满行程 = ±range 绕 default 调高
    height_step: 0.01                       # 键盘 Q/E 单次步进
    linear_x_invert: false                  # 前推右杆应为 +vx；若相反改 true
    angular_z_invert: false                 # 右推右杆应为正转；若相反改 true
    height_invert: false                    # 前推左杆应为升高；若相反改 true
    arm_switch_down_state: 0
    arm_switch_middle_state: 1
    arm_switch_up_state: 3

    fk_tilt_world_frame: false
    imu_pitch_sign: 1.0
    engage_prepare_timeout: 2.0
    # Wheel_leg_V1: O-A-D-C kite loop plus serial O-F-G equivalent leg.
    # Lengths are metres.  Direction/zero parameters below are calibration values.
    five_bar_oc: 0.11640                     # O-C, point on the thigh
    five_bar_of: 0.21300                     # O-F, IsaacLab J1 link
    five_bar_fg: 0.25000                     # F-G, IsaacLab J2 link
    five_bar_oa: 0.11640                     # O-A, knee-driven crank
    five_bar_ad: 0.13500                     # A-D
    five_bar_dc: 0.13500                     # D-C
    five_bar_joint8_length: 0.067            # joint8 rigid member, geometry reference

    left_hip_sign: 1.0
    left_hip_offset: 0.0
    left_knee_sign: 1.0
    left_knee_offset: 0.0
    left_elbow_sign: -1.0                    # D side of A-C; calibrate from assembly
    left_joint8_direction_offset_deg: 0.0    # DC -> joint8 direction
    left_shank_direction_offset_deg: 14.8    # joint8 -> FG direction; 180-165.2

    right_hip_sign: 1.0
    right_hip_offset: 0.0
    right_knee_sign: 1.0
    right_knee_offset: 0.0
    right_elbow_sign: -1.0                   # D side of A-C; calibrate from assembly
    right_joint8_direction_offset_deg: 0.0   # DC -> joint8 direction
    right_shank_direction_offset_deg: 14.8   # joint8 -> FG direction; calibrate sign
