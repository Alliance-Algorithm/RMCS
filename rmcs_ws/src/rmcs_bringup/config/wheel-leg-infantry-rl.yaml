rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::WheelLegInfantryRL -> wheel_leg_infantry_rl
      - rmcs_core::controller::chassis::WheelLegManualController -> wheel_leg_manual_controller

      - rmcs_core::controller::pid::PidController -> left_wheel_velocity_pid
      - rmcs_core::controller::pid::PidController -> right_wheel_velocity_pid

wheel_leg_infantry_rl:
  ros__parameters:
    board_serial: ""
    joint_kp: 30.0
    joint_kd: 1.0
    # 零点改由机械零位姿态下 /wheel_leg/calibrate 写入电机内部（0xFE），
    # 避免大 bias 把工作点顶到 ±P_MAX 边界导致闭环走优弧。保持 0；
    # 若个别关节装配不对称，可填几分之一 rad 的小修正（远离 ±12.5 边界）。
    left_hip_joint_angle_bias: 0.0
    left_knee_joint_angle_bias: 0.0
    right_hip_joint_angle_bias: 0.0
    right_knee_joint_angle_bias: 0.0

wheel_leg_manual_controller:
  ros__parameters:
    deadzone: 0.08
    wheel_velocity_max: 10.0
    joint_angle_rate: 0.5
    joint_angle_limit: 1.5
    control_dt: 0.001
    # 顺序 [左hip, 左knee, 右hip, 右knee]，配合 angle_bias 后机械零位为 0
    default_positions: [0.0, 0.0, 0.0, 0.0]

left_wheel_velocity_pid:
  ros__parameters:
    measurement: /wheel_leg/left_wheel/velocity
    setpoint: /wheel_leg/left_wheel/control_velocity
    control: /wheel_leg/left_wheel/control_torque
    reset_interface: /chassis/reset_count
    kp: 0.6
    ki: 0.0
    kd: 0.0
    output_min: -3.0
    output_max: 3.0
right_wheel_velocity_pid:
  ros__parameters:
    measurement: /wheel_leg/right_wheel/velocity
    setpoint: /wheel_leg/right_wheel/control_velocity
    control: /wheel_leg/right_wheel/control_torque
    reset_interface: /chassis/reset_count
    kp: 0.6
    ki: 0.0
    kd: 0.0
    output_min: -3.0
    output_max: 3.0
