# Wheel-leg infantry RL deployment, V7 paired-107 (official vehicle profile).
# Fresh double DOWN arms; double MIDDLE starts the native self-righting script,
# then the actor takes over all six axes inside the measured capture window.
# Wiring, zeros and the 107..108-degree leg stop follow the confirmed dev/rmcs_rl set.
rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::WheelLeg -> wheel_leg
      - rmcs_core::controller::chassis::WheelLegController -> wheel_leg_controller
      - rmcs_rl::RlBridge -> rl_bridge
      - rmcs_core::controller::chassis::WheelLegChassisController -> wheel_leg_chassis_controller
      - rmcs_core::controller::identification::WheelLegIdentificationRecorder -> wheel_leg_identification_recorder

      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

