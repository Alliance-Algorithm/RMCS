rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::WheelLegInfantryRL -> wheel_leg_infantry_rl
      - rmcs_core::controller::chassis::WheelLegChassisController -> wheel_leg_chassis_controller
      - rmcs_core::controller::chassis::WheelLegRlImu -> wheel_leg_rl_imu
      - rmcs_rl::RlBridge -> rl_bridge
      - rmcs_rl::PolicyServerLauncher -> policy_server_launcher
      - rmcs_core::controller::chassis::WheelLegRlConsumer -> wheel_leg_rl_consumer
      - rmcs_core::controller::chassis::WheelLegJointVelocityController -> wheel_leg_joint_velocity_controller

      - rmcs_core::controller::pid::PidController -> left_wheel_velocity_pid
      - rmcs_core::controller::pid::PidController -> right_wheel_velocity_pid
      # DM 关节 MIT 力矩模式：角度环(wheel_leg_joint_velocity_controller) ->
      # 速度环(以下四个 PID) -> /control_torque -> MIT 帧 t_ff。
      - rmcs_core::controller::pid::PidController -> left_hip_joint_velocity_pid
      - rmcs_core::controller::pid::PidController -> left_knee_joint_velocity_pid
      - rmcs_core::controller::pid::PidController -> right_hip_joint_velocity_pid
      - rmcs_core::controller::pid::PidController -> right_knee_joint_velocity_pid

      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster
      - rmcs_core::broadcaster::WheelLegStateBroadcaster -> wheel_leg_state_broadcaster

wheel_leg_state_broadcaster:
  ros__parameters:
    # 同时间戳的电机/车身IMU/RL IMU快照，供 Foxglove -> MuJoCo 姿态查看。
    publish_rate: 50.0

value_broadcaster:
  ros__parameters:
    forward_list:
      # 四个关节电机（DM）：反馈角度 / 目标角度 / 输出力矩 / 反馈速度
      - /wheel_leg/left_hip_joint/angle
      - /wheel_leg/left_hip_joint/control_angle
      - /wheel_leg/left_hip_joint/control_torque
      - /wheel_leg/left_hip_joint/velocity
      - /wheel_leg/left_knee_joint/angle
      - /wheel_leg/left_knee_joint/control_angle
      - /wheel_leg/left_knee_joint/control_torque
      - /wheel_leg/left_knee_joint/velocity
      - /wheel_leg/right_hip_joint/angle
      - /wheel_leg/right_hip_joint/control_angle
      - /wheel_leg/right_hip_joint/control_torque
      - /wheel_leg/right_hip_joint/velocity
      - /wheel_leg/right_knee_joint/angle
      - /wheel_leg/right_knee_joint/control_angle
      - /wheel_leg/right_knee_joint/control_torque
      - /wheel_leg/right_knee_joint/velocity
      # 两个轮电机（M3508）：反馈角度 / 反馈速度 / 目标速度 / 输出力矩
      - /wheel_leg/left_wheel/angle
      - /wheel_leg/left_wheel/velocity
      - /wheel_leg/left_wheel/control_velocity
      - /wheel_leg/left_wheel/control_torque
      - /wheel_leg/right_wheel/angle
      - /wheel_leg/right_wheel/velocity
      - /wheel_leg/right_wheel/control_velocity
      - /wheel_leg/right_wheel/control_torque

wheel_leg_infantry_rl:
  ros__parameters:
    board_serial: ""
    # raw=0 对应实机标定姿态（URDF5.0），不是训练名义姿态。
    # angle = wrap(offset - raw)，四路均 reversed；无多圈累计。
    # 闭链核对：大腿接近 +z，大小腿内角约105度，左右镜像。
    left_hip_joint_angle_offset: -1.6
    left_knee_joint_angle_offset: -2.93
    right_hip_joint_angle_offset: 1.6
    right_knee_joint_angle_offset: 2.93

wheel_leg_chassis_controller:
  ros__parameters:
    vx_max: 2.5
    yaw_rate_max: 3.0
    deadzone: 0.08
    command_height_min: 0.26
    command_height_max: 0.28
    default_command_height: 0.27
    height_range: 0.01
    height_step: 0.01
    angular_z_invert: false
    heading_kp: 3.0
    height_invert: false

rl_bridge:
  ros__parameters:
    rl_base: "/wheel_leg/rl"
    policy_rate: 50.0
    max_action_age: 0.04
    history_length: 1
    rl_obs_size: 35
    rl_action_size: 6
    enable_interface: "/wheel_leg/rl/enable"
    enable_default: false
    invalid_value: "nan"
    reset_interface: "/chassis/reset_count"
    expected_model_id: "0x7c04c08daef33920"
    joint_names: [left_hip_joint, left_knee_joint, right_hip_joint, right_knee_joint, left_wheel, right_wheel]
    joint_base_path: "/wheel_leg"
    joint_angle_suffix: "/angle"
    joint_velocity_suffix: "/velocity"
    joint_torque_suffix: "/torque"
    # 电机 offset 已把 /angle 换算到 URDF 系，这里直接填 V5 训练名义角（URDF 系），单位 rad。
    # RMCS 的 knee_joint 对应 V5 的 LL_joint1 / RR_joint1 主动电机。
    default_joint_pos:
      left_hip_joint: 0.42
      left_knee_joint: -0.13742282595254576
      right_hip_joint: -0.42
      right_knee_joint: 0.13741557625658019
      left_wheel: 0.0
      right_wheel: 0.0
    observation_terms:
      - index=0 path=/chassis/control_velocity take=x
      - index=1 path=/chassis/control_velocity take=y
      - index=2 path=/chassis/control_velocity take=z
      - index=3 path=/chassis/control_height scale=5.0
      # 训练 IMU 观测直接使用车身 Body xyz；URDF 轴向差异不对 IMU 做 90° 换轴。
      - index=4 path=/wheel_leg/rl/imu/angular_velocity take=vec3 scale=0.5
      - index=7 path=/wheel_leg/rl/imu/projected_gravity take=vec3
      - index=10 type=joint_pos joints=left_hip_joint,left_knee_joint,right_hip_joint,right_knee_joint relative=true
      - index=14 type=joint_pos joints=left_wheel,right_wheel zero=true
      - index=16 type=joint_vel joints=left_hip_joint,left_knee_joint,right_hip_joint,right_knee_joint scale=0.1
      - index=20 type=joint_vel joints=left_wheel,right_wheel scale=0.1
      - index=22 type=last_action
      - index=28 type=constant value=1,0,0,0,0,0,0
    action_terms:
      - index=0 output=/wheel_leg/rl/action/left_hip name=left_hip
      - index=1 output=/wheel_leg/rl/action/left_knee name=left_knee
      - index=2 output=/wheel_leg/rl/action/right_hip name=right_hip
      - index=3 output=/wheel_leg/rl/action/right_knee name=right_knee
      - index=4 output=/wheel_leg/rl/action/left_wheel name=left_wheel
      - index=5 output=/wheel_leg/rl/action/right_wheel name=right_wheel

wheel_leg_rl_consumer:
  ros__parameters:
    rl_base: "/wheel_leg/rl"
    action_scale: 0.25
    wheel_velocity_scale: 10.0
    # 以下目标均为 URDF 关节角（电机 offset 已把 /angle 换算到 URDF 系），单位 rad。
    # 数组顺序: [left_hip, left_knee, right_hip, right_knee]
    # RL 策略名义基准角（与 rl_bridge.default_joint_pos 一致），双中进入 RL 时使用。
    policy_leg_default_position: [0.42, -0.13742282595254576, -0.42, 0.13741557625658019]
    # 左下右中：闭环到 URDF 零点（URDF 系下即为 0）。
    urdf_zero_leg_position: [0.0, 0.0, 0.0, 0.0]
    # 左中右下：闭环到电机内部零点，必须与四个硬件 offset 一致。
    calibrated_zero_leg_position: [-1.6, -2.93, 1.6, 2.93]
    # 失效（双下/丢遥控）目标的安全姿态（URDF 系）。
    # = default_joint_pos + 原标定系相对量 [-0.5, -0.35, 0.5, 0.35]（待实机确认）。
    safe_leg_position: [-0.08, -0.48742282595254576, 0.08, 0.48741557625658019]

wheel_leg_joint_velocity_controller:
  ros__parameters:
    # 单圈反馈 -> 整腿转向(圆周) + 开合差值(有界) -> 同侧两路速度。
    # 仅整腿转向选弧；开合误差不取短弧。无累加圈数、独立轴轨迹或越界前馈。
    angle_kp: 6.0
    max_joint_velocity: 2.0
    max_joint_acceleration: 4.0
    max_feedback_speed: 45.0
    max_feedback_jump: 0.5
    # V5六闭环直接求解的30–120度区间（120度不再使用线性外推）。
    min_motor_difference: -0.47376
    max_motor_difference: 1.62433
    motor_difference_margin: 0.04

policy_server:
  ros__parameters:
    rl_base: "/wheel_leg/rl"
    rl_model_path: "models/wheel_leg_v2.onnx"
    input_name: "obs"
    output_name: "actions"
    model_type: "auto"
    rl_obs_size: 35        # 必须与 rl_bridge.rl_obs_size 一致（启动期尺寸交叉校验）
    rl_action_size: 6
    normalization_from_metadata: true
    publish_status: true

policy_server_launcher:
  ros__parameters:
    autostart: true
    params_file: "wheel-leg-infantry-rl.yaml"
    respawn: true
    respawn_delay: 1.0
    poll_interval: 0.5

left_wheel_velocity_pid:
  ros__parameters:
    measurement: /wheel_leg/left_wheel/velocity
    setpoint: /wheel_leg/left_wheel/control_velocity
    control: /wheel_leg/left_wheel/control_torque
    reset_interface: /chassis/reset_count
    kp: 0.6
    ki: 0.0
    kd: 0.0
    output_min: -4.5
    output_max: 4.5
right_wheel_velocity_pid:
  ros__parameters:
    measurement: /wheel_leg/right_wheel/velocity
    setpoint: /wheel_leg/right_wheel/control_velocity
    control: /wheel_leg/right_wheel/control_torque
    reset_interface: /chassis/reset_count
    kp: 0.6
    ki: 0.0
    kd: 0.0
    output_min: -4.5
    output_max: 4.5
# MIT 力矩模式：角度环给速度，速度 PID 给力矩；运动门控关闭时清积分并输出零。
# PidCalculator 在 1 kHz 下按周期累加误差：ki=0.05 对应连续积分增益 50，积分限对应 ±20 Nm。
left_hip_joint_velocity_pid:
  ros__parameters:
    measurement: /wheel_leg/left_hip_joint/velocity
    setpoint: /wheel_leg/left_hip_joint/control_velocity
    control: /wheel_leg/left_hip_joint/control_torque
    reset_interface: /chassis/reset_count
    enable_interface: /wheel_leg/joint_control_active
    kp: 10.0
    ki: 0.05
    kd: 0.0
    integral_min: -400.0
    integral_max: 400.0
    output_min: -40.0
    output_max: 40.0
left_knee_joint_velocity_pid:
  ros__parameters:
    measurement: /wheel_leg/left_knee_joint/velocity
    setpoint: /wheel_leg/left_knee_joint/control_velocity
    control: /wheel_leg/left_knee_joint/control_torque
    reset_interface: /chassis/reset_count
    enable_interface: /wheel_leg/joint_control_active
    kp: 10.0
    ki: 0.05
    kd: 0.0
    integral_min: -400.0
    integral_max: 400.0
    output_min: -40.0
    output_max: 40.0
right_hip_joint_velocity_pid:
  ros__parameters:
    measurement: /wheel_leg/right_hip_joint/velocity
    setpoint: /wheel_leg/right_hip_joint/control_velocity
    control: /wheel_leg/right_hip_joint/control_torque
    reset_interface: /chassis/reset_count
    enable_interface: /wheel_leg/joint_control_active
    kp: 10.0
    ki: 0.05
    kd: 0.0
    integral_min: -400.0
    integral_max: 400.0
    output_min: -40.0
    output_max: 40.0
right_knee_joint_velocity_pid:
  ros__parameters:
    measurement: /wheel_leg/right_knee_joint/velocity
    setpoint: /wheel_leg/right_knee_joint/control_velocity
    control: /wheel_leg/right_knee_joint/control_torque
    reset_interface: /chassis/reset_count
    enable_interface: /wheel_leg/joint_control_active
    kp: 10.0
    ki: 0.05
    kd: 0.0
    integral_min: -400.0
    integral_max: 400.0
    output_min: -40.0
    output_max: 40.0
