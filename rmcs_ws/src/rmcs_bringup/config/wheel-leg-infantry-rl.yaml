rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::WheelLeg -> wheel_leg
      - rmcs_core::controller::chassis::WheelLegRlConsumer -> wheel_leg_rl_consumer
      - rmcs_rl::RlBridge -> rl_bridge
      - rmcs_rl::PolicyServerLauncher -> policy_server_launcher
      - rmcs_core::controller::chassis::WheelLegChassisController -> wheel_leg_chassis_controller
      - rmcs_core::controller::pid::PidController -> left_wheel_velocity_pid
      - rmcs_core::controller::pid::PidController -> right_wheel_velocity_pid

wheel_leg:
  ros__parameters:
    board_serial: ""
    joint_control_mode: "position_pd"
    joint_position_kp: 5.0
    joint_position_kd: 0.3
    require_enable_request: true
    # Only an armed RL session may keep control at left-MIDDLE/right-DOWN.
    allow_spin_switch: true
    # The DM drives were already internally zeroed at the 105-degree reference.
    allow_set_zero: false
    # 电机反馈 Master ID，按左髋/右髋/左膝/右膝顺序。
    dm_master_ids: [1, 2, 1, 2]
    # Reuse the user-confirmed dev/rmcs_rl hardware configuration @ 8149afda:
    # its DM8009 driver uses P_MAX=12.5, V_MAX=45, T_MAX=54.
    # Rated/peak torque and the MIT feedback quantization range are distinct.
    # 顺序同 dm_master_ids；实际命令限幅会取 min(dm_control_torque_max, dm_mit_torque_max)。
    dm_mit_position_max: [12.5, 12.5, 12.5, 12.5]
    dm_mit_velocity_max: [45.0, 45.0, 45.0, 45.0]
    dm_mit_torque_max: [54.0, 54.0, 54.0, 54.0]
    dm_control_torque_max: [40.0, 40.0, 40.0, 40.0]

    # This configuration uses zero-Kp/Kd MIT pure-torque commands.
    # All six drive loops run on the PC (not DM internal position control).

rl_bridge:
  ros__parameters:
    rl_base: "/wheel_leg/rl"
    policy_rate: 50.0
    max_action_age: 0.04
    history_length: 1
    rl_obs_size: 35
    rl_action_size: 6
    # Produced by the chassis controller, upstream of the bridge and RL consumer.
    enable_interface: "/wheel_leg/enable_request"
    enable_default: false
    invalid_value: "nan"
    reset_interface: "/chassis/reset_count"
    joint_names: [left_hip_joint, left_knee_joint, right_hip_joint, right_knee_joint, left_wheel, right_wheel]
    joint_base_path: "/wheel_leg"
    joint_angle_suffix: "/angle"
    joint_velocity_suffix: "/velocity"
    joint_torque_suffix: "/torque"
    # Observation reference only: these are the policy's nominal joint positions,
    # not hardware calibration or model identity metadata.
    default_joint_pos:
      left_hip_joint: 0.42
      left_knee_joint: -0.13742282595254576
      right_hip_joint: -0.42
      right_knee_joint: 0.13741557625658019
      left_wheel: 0.0
      right_wheel: 0.0
    observation_terms:
      - index=0 path=/chassis/control_velocity take=x
      - index=1 path=/chassis/control_velocity take=y
      - index=2 path=/chassis/control_velocity take=z
      - index=3 path=/chassis/control_height scale=5.0
      # Keep the model's semantic layout names while binding hardware-owned Body IMU data.
      - index=4 path=/wheel_leg/imu/angular_velocity take=vec3 scale=0.5 name=vec3:/wheel_leg/rl/imu/angular_velocity
      # Hardware projects world-down into Body using inverse(q_WB), matching training.
      - index=7 path=/wheel_leg/imu/projected_gravity take=vec3 name=vec3:/wheel_leg/rl/imu/projected_gravity
      - index=10 type=joint_pos joints=left_hip_joint,left_knee_joint,right_hip_joint,right_knee_joint relative=true
      - index=14 type=joint_pos joints=left_wheel,right_wheel zero=true
      - index=16 type=joint_vel joints=left_hip_joint,left_knee_joint,right_hip_joint,right_knee_joint scale=0.1
      - index=20 type=joint_vel joints=left_wheel,right_wheel scale=0.1
      - index=22 type=last_action
      - index=28 type=constant value=1,0,0,0,0,0,0
    action_terms:
      - index=0 output=/wheel_leg/rl/action/left_hip name=left_hip
      - index=1 output=/wheel_leg/rl/action/left_knee name=left_knee
      - index=2 output=/wheel_leg/rl/action/right_hip name=right_hip
      - index=3 output=/wheel_leg/rl/action/right_knee name=right_knee
      - index=4 output=/wheel_leg/rl/action/left_wheel name=left_wheel
      - index=5 output=/wheel_leg/rl/action/right_wheel name=right_wheel

policy_server:
  ros__parameters:
    rl_base: "/wheel_leg/rl"
    rl_model_path: "models/wheel_leg_v3.onnx"
    input_name: "obs"
    output_name: "actions"
    model_type: "auto"
    rl_obs_size: 35
    rl_action_size: 6
    normalization_from_metadata: false
    publish_status: false

policy_server_launcher:
  ros__parameters:
    autostart: true
    params_file: "wheel-leg-infantry-rl.yaml"
    respawn: true
    respawn_delay: 1.0
    poll_interval: 0.5

wheel_leg_rl_consumer:
  ros__parameters:
    rl_base: "/wheel_leg/rl"
    action_scale: 0.25
    wheel_velocity_scale: 10.0
    default_leg_position: [0.42, -0.13742282595254576, -0.42, 0.13741557625658019]
    safe_leg_position: [0.0, 0.0, 0.0, 0.0]

wheel_leg_chassis_controller:
  ros__parameters:
    vx_max: 0.5
    vy_max: 0.0
    yaw_rate_max: 1.0
    spin_yaw_rate: 1.0
    deadzone: 0.08
    command_height_min: 0.23
    command_height_max: 0.43
    default_command_height: 0.305
    height_step: 0.01
    angular_z_invert: false
    height_invert: false
    jump_enabled: false

left_wheel_velocity_pid:
  ros__parameters:
    measurement: /wheel_leg/left_wheel/velocity
    setpoint: /wheel_leg/left_wheel/control_velocity
    control: /wheel_leg/left_wheel/control_torque
    kp: 0.6
    ki: 0.0
    kd: 0.0
    output_min: -4.5
    output_max: 4.5

right_wheel_velocity_pid:
  ros__parameters:
    measurement: /wheel_leg/right_wheel/velocity
    setpoint: /wheel_leg/right_wheel/control_velocity
    control: /wheel_leg/right_wheel/control_torque
    kp: 0.6
    ki: 0.0
    kd: 0.0
    output_min: -4.5
    output_max: 4.5
