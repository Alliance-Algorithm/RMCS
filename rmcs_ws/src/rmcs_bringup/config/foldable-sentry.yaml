rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::FoldableSentry -> foldable_sentry

      - rmcs_core::referee::Status -> referee_status
      - rmcs_core::referee::Command -> referee_command
      - rmcs_core::referee::command::Interaction -> referee_interaction
      - rmcs_core::referee::command::interaction::SentryDecision -> referee_sentry_decision
      - rmcs_core::referee::command::interaction::Ui -> referee_ui

      - rmcs_core::controller::gimbal::FoldableGimbalController -> gimbal_controller
      - rmcs_core::controller::chassis::SentryTunnelCross -> sentry_tunnel_cross

      - rmcs_core::controller::shooting::ThreeFrictionWheelController -> friction_wheel_controller
      - rmcs_core::controller::shooting::BulletFeederController17mm -> bullet_feeder_controller
      - rmcs_core::controller::shooting::HeatController -> heat_controller
      - rmcs_core::controller::pid::PidController -> top_friction_velocity_pid_controller
      - rmcs_core::controller::pid::PidController -> left_friction_velocity_pid_controller
      - rmcs_core::controller::pid::PidController -> right_friction_velocity_pid_controller
      - rmcs_core::controller::pid::PidController -> bullet_feeder_velocity_pid_controller

      - rmcs_core::controller::chassis::ChassisController -> chassis_controller
      - rmcs_core::controller::chassis::ChassisPowerController -> chassis_power_controller
      - rmcs_core::controller::chassis::OmniWheelController -> omni_wheel_controller

      # - rmcs_core::controller::identification::TopYawSweepController -> top_yaw_sweep_controller
      # - rmcs_core::broadcaster::TfBroadcaster -> tf_broadcaster

      # - rmcs::AutoAimRecorderComponent -> auto_aim_recorder
      # - rmcs::AutoAimCapturerComponent -> auto_aim_capturer
      # - rmcs::AutoAimComponent -> auto_aim_component

      # - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

foldable_sentry:
  ros__parameters:
    board_serial_chassis_board: "AF-79CF-C275-34AA-F714-8CC6-E363-5B59-FB4E"
    board_serial_gimbal_board: "AF-60BB-7484-FA24-F3FC-399B-454D-22FA-1B1D"

    roll_motor_zero_point: 14733
    top_yaw_motor_zero_point: 3433
    pitch_motor_zero_point: 28369
    bottom_yaw_motor_zero_point: 0

auto_aim_capturer:
  ros__parameters:
    camera_name: ""
    exposure_us: 2000.0
    gain: 10.0
    framerate: 120.0
    invert_image: true
    rls_tau_sec: 10.0
    use_hardware_sync: true
    delay_ms: 6.5

auto_aim_recorder:
  ros__parameters:
    output_path: "/autoaim/records"
    queue_depth: 16
    flush_every_n_frames: 64
    max_duration_seconds: 300
    max_videos_size_gb: 100.0
    auto_record: false

auto_aim_component:
  ros__parameters:
    manual_shoot: false
    enable_rune: false
    default_attack_rune: false
    track_ids: [FULL]
    camera_translation: [0.07128, 0.0, 0.0481]
    fire_control:
      bullet_speed: 22.5
      shoot_delay: 0.05
      offset_yaw: -0.4
      offset_pitch: -0.1
      attack_window: 120.0
      degraded_angle_speed: 12.0
      window_redundancy: 0.8
      window_hysteresis: 0.2
      attack_preaim: false
      yaw_tolerance: 0.14
      pitch_tolerance: 0.08
      rune_idle_duration: 0.4
      rune_shoot_duration: 0.2
      require_stable_command: false

chassis_controller:
  ros__parameters:
    angular_velocity_max: 10.0
    translational_velocity_max: 10.0
    following_velocity_kp: 7.0
    following_velocity_ki: 0.0
    following_velocity_kd: 0.0
    alignment_angle_tolerance: 0.2
    alignment_velocity_tolerance: 0.2

sentry_tunnel_cross:
  ros__parameters:
    speed: 1.2
    duration: 2.0
    pre_drive_delay: 0.2
    fold_timeout: 5.0
    unfold_timeout: 5.0

value_broadcaster:
  ros__parameters:
    forward_list:
      - /gimbal/roll/angle
      - /gimbal/roll/velocity

gimbal_controller:
  ros__parameters:
    # 折叠/展开姿态角，按实车标定。
    roll_folded_angle: 3.264
    roll_unfold_angle: 6.2808
    top_yaw_folded_angle: 6.218
    pitch_folded_angle: -0.04

    pitch_upper_limit: -0.550
    pitch_lower_limit: 0.530

    fold_ready_time: 0.1
    fold_velocity_tolerance: 0.2
    fold_angle_tolerance: 0.2

    top_yaw_velocity_ff_gain: 0.0
    top_yaw_ff_cutoff_hz: 0.0
    top_yaw_ff_max: 0.0
    top_yaw_ff_jump_threshold: 0.0

    top_yaw_angle_kp: 40.0
    top_yaw_angle_ki: 0.0
    top_yaw_angle_kd: 0.000
    top_yaw_velocity_kp: 0.15
    top_yaw_velocity_ki: 0.0
    top_yaw_velocity_kd: 0.0

    bottom_yaw_angle_kp: 25.0
    bottom_yaw_angle_ki: 0.01
    bottom_yaw_angle_kd: 0.0
    bottom_yaw_velocity_kp: 2.75
    bottom_yaw_velocity_ki: 0.00125
    bottom_yaw_velocity_kd: 0.0

    pitch_angle_kp: 35.0
    pitch_angle_ki: 0.0001
    pitch_angle_kd: 0.0
    pitch_velocity_kp: 2.8
    pitch_velocity_ki: 0.00
    pitch_velocity_kd: 0.0

    roll_angle_kp: 50.0
    roll_angle_ki: 0.0001
    roll_angle_kd: 0.0
    roll_velocity_kp: 6.0
    roll_velocity_ki: 0.00
    roll_velocity_kd: 0.0

    # roll 轴前馈
    roll_reaction_ff_gain: 0.6
    roll_accel_ff_gain: 0.004
    roll_accel_ff_cutoff_hz: 30.0
    roll_accel_ff_max: 150.0
    roll_accel_ff_jump_threshold: 35.0

    top_yaw_angle_integral_min: -187.0
    top_yaw_angle_integral_max: 187.0
    top_yaw_velocity_integral_min: -2400.0
    top_yaw_velocity_integral_max: 2400.0

    bottom_yaw_angle_integral_min: -150.0
    bottom_yaw_angle_integral_max: 150.0
    bottom_yaw_velocity_integral_min: -2400.0
    bottom_yaw_velocity_integral_max: 2400.0

    pitch_angle_integral_min: -150.0
    pitch_angle_integral_max: 150.0
    pitch_velocity_integral_min: -2400.0
    pitch_velocity_integral_max: 2400.0

    roll_angle_integral_min: -150.0
    roll_angle_integral_max: 150.0
    roll_velocity_integral_min: -2400.0
    roll_velocity_integral_max: 2400.0

    # PID 输出限幅：角环输出为速度参考(rad/s)，速度环输出为关节力矩(N*m)。
    top_yaw_angle_output_min: -10.0
    top_yaw_angle_output_max: 10.0
    top_yaw_velocity_output_min: -4.5
    top_yaw_velocity_output_max: 4.5

    pitch_angle_output_min: -10.0
    pitch_angle_output_max: 10.0
    pitch_velocity_output_min: -4.5
    pitch_velocity_output_max: 4.5

    roll_angle_output_min: -10.0
    roll_angle_output_max: 10.0
    roll_velocity_output_min: -5.0
    roll_velocity_output_max: 5.0

# top_yaw 位置正弦扫频：展开状态下由右拨杆 MIDDLE->UP 触发（保持 UP 运行），
# 扫频期间通过 /gimbal/top_yaw/control_torque_test 覆盖云台控制器的 top_yaw 力矩，
# 同时记录 roll 角度闭环响应用于耦合分析。
# 注意：右拨杆 UP 用于自瞄，扫频仅用于台架识别，实车请保持 enable 为 false。
top_yaw_sweep_controller:
  ros__parameters:
    enable: false

    log_directory: /workspaces/RMCS

    angle_min: -0.64
    angle_max: 0.90

    start_freq: 0.1
    end_freq: 10.0
    duration: 60.0
    logarithmic: true

    settle_time: 2.0
    angle_tolerance: 0.02
    approach_timeout: 10.0
    abort_margin: 0.03
    abort_velocity: 0.0

    angle_kp: 40.0
    angle_ki: 0.0
    angle_kd: 0.0
    angle_output_min: -4.0
    angle_output_max: 4.0

    velocity_kp: 0.23
    velocity_ki: 0.0
    velocity_kd: 0.0
    velocity_output_min: -2.0
    velocity_output_max: 2.0

heat_controller:
  ros__parameters:
    heat_per_shot: 10000
    reserved_heat: 30000

friction_wheel_controller:
  ros__parameters:
    friction_wheels:
      - /gimbal/top_friction
      - /gimbal/left_friction
      - /gimbal/right_friction
    friction_velocities: [950.0, 950.0, 950.0]
    friction_soft_start_stop_time: 1.0

bullet_feeder_controller:
  ros__parameters:
    bullets_per_feeder_turn: 8.0
    shot_frequency: 30.0
    safe_shot_frequency: 10.0
    eject_frequency: 10.0
    eject_time: 0.05
    deep_eject_frequency: 5.0
    deep_eject_time: 0.2
    single_shot_max_stop_delay: 2.0

top_friction_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/top_friction/velocity
    setpoint: /gimbal/top_friction/control_velocity
    control: /gimbal/top_friction/control_torque
    kp: 0.003436926
    ki: 0.0
    kd: 0.009373434

left_friction_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/left_friction/velocity
    setpoint: /gimbal/left_friction/control_velocity
    control: /gimbal/left_friction/control_torque
    kp: 0.003436926
    ki: 0.0
    kd: 0.009373434

right_friction_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/right_friction/velocity
    setpoint: /gimbal/right_friction/control_velocity
    control: /gimbal/right_friction/control_torque
    kp: 0.003436926
    ki: 0.0
    kd: 0.009373434

bullet_feeder_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/bullet_feeder/velocity
    setpoint: /gimbal/bullet_feeder/control_velocity
    control: /gimbal/bullet_feeder/control_torque
    kp: 0.700
    ki: 0.0
    kd: 0.0
