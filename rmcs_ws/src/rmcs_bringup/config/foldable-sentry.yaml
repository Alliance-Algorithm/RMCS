rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::FoldableSentry -> foldable_sentry

      - rmcs_core::controller::gimbal::FoldableGimbalController -> gimbal_controller

      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

foldable_sentry:
  ros__parameters:
    board_serial: ""

    roll_motor_zero_point: 0
    top_yaw_motor_zero_point: 0
    pitch_motor_zero_point: 0

value_broadcaster:
  ros__parameters:
    forward_list:
      - /gimbal/roll/angle
      - /gimbal/roll/velocity
      - /gimbal/roll/torque
      - /gimbal/top_yaw/angle
      - /gimbal/top_yaw/velocity
      - /gimbal/top_yaw/torque
      - /gimbal/pitch/angle
      - /gimbal/pitch/velocity
      - /gimbal/pitch/torque
      - /gimbal/roll/control_torque
      - /gimbal/pitch/control_torque
      - /gimbal/top_yaw/control_torque
      - /gimbal/yaw/angle
      - /gimbal/yaw/velocity

gimbal_controller:
  ros__parameters:
    # 折叠/展开姿态角，按实车标定。
    # bench_mode=true：pitch/top_yaw 用电机编码器角反馈(云台上暂时没陀螺仪)
    bench_mode: true

    roll_folded_angle: 0.0
    roll_unfold_angle: 0.0
    top_yaw_folded_angle: 0.0
    pitch_folded_angle: 0.0

    pitch_upper_limit: -0.65
    pitch_lower_limit: 0.36

    fold_ready_time: 0.2
    fold_velocity_tolerance: 0.05
    fold_angle_tolerance: 0.05

    # top_yaw_velocity_ff_gain: 0.0
    # top_yaw_ff_cutoff_hz: 10.0
    # top_yaw_ff_max: 2.0
    # top_yaw_ff_jump_threshold: 0.01

    top_yaw_angle_kp: 30.0
    top_yaw_angle_ki: 0.008
    top_yaw_angle_kd: 0.005
    top_yaw_velocity_kp: 2.160
    top_yaw_velocity_ki: 0.0
    top_yaw_velocity_kd: 0.0

    bottom_yaw_angle_kp: 15.0
    bottom_yaw_angle_ki: 0.01
    bottom_yaw_angle_kd: 0.0
    bottom_yaw_velocity_kp: 2.75
    bottom_yaw_velocity_ki: 0.00125
    bottom_yaw_velocity_kd: 0.0

    pitch_angle_kp: 35.0
    pitch_angle_ki: 0.01
    pitch_angle_kd: 0.0
    pitch_velocity_kp: 2.5
    pitch_velocity_ki: 0.01
    pitch_velocity_kd: 0.0

    roll_angle_kp: 35.0
    roll_angle_ki: 0.01
    roll_angle_kd: 0.0
    roll_velocity_kp: 2.5
    roll_velocity_ki: 0.01
    roll_velocity_kd: 0.0

    top_yaw_angle_integral_min: -187.0
    top_yaw_angle_integral_max: 187.0
    top_yaw_velocity_integral_min: -2400.0
    top_yaw_velocity_integral_max: 2400.0

    bottom_yaw_angle_integral_min: -150.0
    bottom_yaw_angle_integral_max: 150.0
    bottom_yaw_velocity_integral_min: -2400.0
    bottom_yaw_velocity_integral_max: 2400.0

    pitch_angle_integral_min: -150.0
    pitch_angle_integral_max: 150.0
    pitch_velocity_integral_min: -2400.0
    pitch_velocity_integral_max: 2400.0

    roll_angle_integral_min: -150.0
    roll_angle_integral_max: 150.0
    roll_velocity_integral_min: -2400.0
    roll_velocity_integral_max: 2400.0

    # PID 输出限幅：角环输出为速度参考(rad/s)，速度环输出为关节力矩(N*m)。
    top_yaw_angle_output_min: -10.0
    top_yaw_angle_output_max: 10.0
    top_yaw_velocity_output_min: -2.0
    top_yaw_velocity_output_max: 2.0

    pitch_angle_output_min: -10.0
    pitch_angle_output_max: 10.0
    pitch_velocity_output_min: -4.5
    pitch_velocity_output_max: 4.5

    roll_angle_output_min: -10.0
    roll_angle_output_max: 10.0
    roll_velocity_output_min: -7.0
    roll_velocity_output_max: 7.0

