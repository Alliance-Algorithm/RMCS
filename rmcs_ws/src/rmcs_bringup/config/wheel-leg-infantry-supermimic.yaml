rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::WheelLeg -> wheel_leg

      - rmcs_core::controller::chassis::WheelLegChassisController -> wheel_leg_chassis_controller
      - rmcs_core::controller::chassis::WheelLegStateEstimator -> wheel_leg_state_estimator
      - rmcs_core::controller::chassis::WheelLegRlController -> wheel_leg_rl_controller

      - rmcs_core::controller::chassis::WheelLegObservation -> wheel_leg_observation

      - rmcs_core::controller::gimbal::SimpleGimbalController -> gimbal_controller
      - rmcs_core::controller::pid::ErrorPidController -> yaw_angle_pid_controller
      - rmcs_core::controller::pid::PidController -> yaw_velocity_pid_controller
      - rmcs_core::controller::pid::ErrorPidController -> pitch_angle_pid_controller
      - rmcs_core::controller::pid::PidController -> pitch_velocity_pid_controller
      - rmcs_core::controller::gimbal::PitchGravityFeedforward -> pitch_gravity_ff
      - rmcs_core::controller::pid::PidController -> left_friction_velocity_pid_controller
      - rmcs_core::controller::pid::PidController -> right_friction_velocity_pid_controller
      - rmcs_core::controller::pid::PidController -> bullet_feeder_velocity_pid_controller
      - rmcs_core::referee::Status -> referee_status
      - rmcs_core::controller::shooting::FrictionWheelController -> friction_wheel_controller
      - rmcs_core::controller::shooting::HeatController -> heat_controller
      - rmcs_core::controller::shooting::BulletFeederController17mm -> bullet_feeder_controller

      - rmcs_rl::RlBridge -> rl_bridge

      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster
      - rmcs_rl::WheelLegMirrorComponent -> wheel_leg_mirror
      - rmcs_core::debug::ValueCollector -> value_collector

wheel_leg:
  ros__parameters:
    serial_filter_bottom_board: "AF-CBB3-7053-32C5-F3B5-B460-A786-DA9A-1FF1"
    serial_filter_top_board: "AF-46C7-7B12-9364-64F6-D95A-E4F4-9299-1B75"
    yaw_motor_zero_point: 58379
    pitch_motor_zero_point: 12637



    dm_master_ids: [1, 2, 1, 2]
    dm_mit_position_max: [12.5, 12.5, 12.5, 12.5]
    dm_mit_velocity_max: [45.0, 45.0, 45.0, 45.0]
    dm_mit_torque_max: [54.0, 54.0, 54.0, 54.0]
    dm_control_torque_max: [40.0, 40.0, 40.0, 40.0]

    feedback_timeout_s: 0.05


wheel_leg_chassis_controller:
  ros__parameters:
    vx_max: 2.7
    vx_bias: 0.0
    vy_max: 2.7
    yaw_rate_max: 4.0 # Follow-mode yaw cap only; at policy training envelope.
    spin_yaw_rate: 10.471975511965978
    yaw_stick_rate: 3.141592653589793
    following_velocity_kp: 15.0
    following_velocity_ki: 0.0
    following_velocity_kd: 0.0

    deadzone: 0.05
    angular_z_invert: false

    command_height_min: 0.23
    command_height_max: 0.40
    default_command_height: 0.32
    height_rate: 0.1

    arm_dwell_seconds: 0.0
    follow_mode_default: true
    jump_request_height: 0.40
    rotary_jump_enabled: true

wheel_leg_state_estimator:
  ros__parameters:
    policy: history
    dt: 0.001
    velocity_sign: 1.0

wheel_leg_rl_controller:
  ros__parameters:
    policy: history
    pd_rate: 1000.0
    leg_kp: 160.0
    leg_kd: 2.5
    jump_enabled: true
    inference_timeout: 0.06
    heading_hold_enabled: false
    height_reference_rate_max: 0.6666666666666666

    self_righting:
      enabled: true
      simulation_only: false
      hardware_mapping_verified: true
      fold_plant_speed_rad_s: 2.0
      insert_speed_rad_s: 2.0
      orbit_speed_rad_s: 2.0
      push_speed_rad_s: 2.0
      capture_speed_rad_s: 2.0
      side_speed_rad_s: 2.0
    drive_loss_debounce: 0.1

wheel_leg_observation:
  ros__parameters:
    policy: history

gimbal_controller:
  ros__parameters:
    upper_limit: -0.6109 # up 35 deg
    lower_limit: 0.5236 # down 30 deg

yaw_angle_pid_controller:
  ros__parameters:
    reset_interface: /chassis/reset_count
    measurement: /gimbal/yaw/control_angle_error
    control: /gimbal/yaw/control_velocity
    kp: 5.0
    ki: 0.0
    kd: 0.0

yaw_velocity_pid_controller:
  ros__parameters:
    output_min: -4.5
    output_max: 4.5
    reset_interface: /chassis/reset_count
    measurement: /gimbal/yaw/velocity_imu
    setpoint: /gimbal/yaw/control_velocity
    control: /gimbal/yaw/control_torque
    kp: 1.5
    ki: 0.0
    kd: 0.0

pitch_angle_pid_controller:
  ros__parameters:
    reset_interface: /chassis/reset_count
    measurement: /gimbal/pitch/control_angle_error
    control: /gimbal/pitch/control_velocity
    kp: 6.0
    ki: 0.0
    kd: 0.0

pitch_velocity_pid_controller:
  ros__parameters:
    output_min: -4.5
    output_max: 4.5
    reset_interface: /chassis/reset_count
    measurement: /gimbal/pitch/velocity_imu
    setpoint: /gimbal/pitch/control_velocity
    control: /gimbal/pitch/control_torque
    feedforward: /gimbal/pitch/torque_ff
    kp: 1.5
    ki: 0.0
    kd: 0.0

pitch_gravity_ff:
  ros__parameters:
    pitch_gravity_ff_gain: 0.9
    pitch_gravity_ff_phase: 0.75

friction_wheel_controller:
  ros__parameters:
    friction_wheels:
      - /gimbal/left_friction
      - /gimbal/right_friction
    friction_velocities:
      - 660.0
      - 660.0
    friction_soft_start_stop_time: 1.0

heat_controller:
  ros__parameters:
    heat_per_shot: 10000
    reserved_heat: 10000

bullet_feeder_controller:
  ros__parameters:
    bullets_per_feeder_turn: 8.0
    shot_frequency: 20.0
    safe_shot_frequency: 10.0
    eject_frequency: 10.0
    eject_time: 0.05
    deep_eject_frequency: 5.0
    deep_eject_time: 0.20
    single_shot_max_stop_delay: 2.0

left_friction_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/left_friction/velocity
    setpoint: /gimbal/left_friction/control_velocity
    control: /gimbal/left_friction/control_torque
    kp: 0.003436926
    ki: 0.0
    kd: 0.009373434

right_friction_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/right_friction/velocity
    setpoint: /gimbal/right_friction/control_velocity
    control: /gimbal/right_friction/control_torque
    kp: 0.003436926
    ki: 0.0
    kd: 0.009373434

bullet_feeder_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/bullet_feeder/velocity
    setpoint: /gimbal/bullet_feeder/control_velocity
    control: /gimbal/bullet_feeder/control_torque
    kp: 1.583
    ki: 0.0
    kd: 0.0

rl_bridge:
  ros__parameters:
    rl_base: /wheel_leg/rl
    rl_model_path: models/wheel_leg/actor_with_estimate.onnx
    model_type: mlp
    input_name: history
    output_name: action
    estimate_output_name: estimate
    estimate_size: 5

    policy_rate: 50.0
    history_length: 5
    rl_obs_size: 175
    rl_feature_size: 35
    rl_action_size: 6
    obs_clip: 100.0

    inference_timeout: 0.06
    max_action_age: 0.06

    enable_interface: /wheel_leg/rl/input/enable
    reset_interface: /chassis/reset_count
    enable_default: false
    invalid_value: "nan"

    stack_external_frames: true
    observation_frame_sequence_interface: /wheel_leg/rl/input/frame_sequence

    normalization_from_metadata: false
    expected_metadata:
      supermimic.chassis_command_contract: gimbal_target_heading_v1
      supermimic.history_order: oldest_to_newest
      supermimic.action_units: normalized_issued_action

    observation_terms:
      - index=0 path=/wheel_leg/rl/input/frame take=array type=double_array dim=35 name=frame

    action_terms:
      - index=0 output=/wheel_leg/rl/raw/left_hip_joint scale=1.0
      - index=1 output=/wheel_leg/rl/raw/left_knee_joint scale=1.0
      - index=2 output=/wheel_leg/rl/raw/right_hip_joint scale=1.0
      - index=3 output=/wheel_leg/rl/raw/right_knee_joint scale=1.0
      - index=4 output=/wheel_leg/rl/raw/left_wheel scale=1.0
      - index=5 output=/wheel_leg/rl/raw/right_wheel scale=1.0

wheel_leg_mirror:
  ros__parameters:
    enabled: true
    update_rate: 100.0

value_broadcaster:
  ros__parameters:
    update_rate: 50.0
    forward_list:
      - /wheel_leg/rl/state
      - /wheel_leg/rl/fault_latched
      - /wheel_leg/rl/pd_rate
      - /wheel_leg/rl/leg_kp
      - /wheel_leg/rl/leg_kd
      - /wheel_leg/rl/jump/active
      - /wheel_leg/rl/jump/pending
      - /wheel_leg/rl/jump/clock
      - /wheel_leg/rl/jump/height
      - /wheel_leg/rl/jump/response
      - /wheel_leg/rl/jump/end_reason
      - /wheel_leg/rl/estimate_valid
      - /wheel_leg/feedback_fresh
      - /wheel_leg/feedback_available
      - /wheel_leg/dm_control_ready
      - /wheel_leg/recovery/phase
      - /wheel_leg/recovery/fault
      - /wheel_leg/recovery/capture_ready
      - /wheel_leg/recovery/capture_blockers
      - /wheel_leg/left_hip_joint/status_code
      - /wheel_leg/left_hip_joint/fault_code
      - /wheel_leg/left_knee_joint/status_code
      - /wheel_leg/left_knee_joint/fault_code
      - /wheel_leg/right_hip_joint/status_code
      - /wheel_leg/right_hip_joint/fault_code
      - /wheel_leg/right_knee_joint/status_code
      - /wheel_leg/right_knee_joint/fault_code
      - /gimbal/yaw/angle
      - /gimbal/yaw/velocity
      - /gimbal/pitch/angle
      - /gimbal/pitch/velocity
      - /gimbal/left_friction/velocity
      - /gimbal/right_friction/velocity
      - /gimbal/bullet_feeder/velocity

value_collector:
