    motion.max_velocity: 5.0
    motion.max_yaw_rate: 12.0
    motion.channel_kp: 10.0
    motion.velocity_accel: 1.5
    motion.velocity_jerk: 4.0
    motion.yaw_accel: 6.28
    motion.yaw_jerk: 40.0
    motion.velocity_sign: -1.0
    motion.gravity: 9.81
    motion.bank_to_roll_bias: 1.06
    motion.friction_mu: 2.0
    motion.track_width: 0.3966
    motion.com_height: 0.26
    motion.lat_accel_safety: 0.7
    balance.pitch_cutoff_hz: 30.0
    balance.pitch_gain: -17.6
    balance.pitch_rate_gain: -3.6
    balance.velocity_gain: -3.0
    balance.distance_gain: 0.0
    balance.balance_limit: 3.69
    balance.yaw_gain: -10.8
    balance.yaw_rate_gain: -4.3
    balance.yaw_limit: 8.0
    balance.yaw_sign: -1.0
    balance.wheel_limit: 4.88
    balance.roll_kp: -1.0
    balance.roll_kd: -50.0
    balance.roll_limit: 0.5
    balance.yaw_enabled: false
