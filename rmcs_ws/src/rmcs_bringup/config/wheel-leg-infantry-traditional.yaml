rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::WheelLeg -> wheel_leg

      - rmcs_core::controller::chassis::WheelLegChassisController -> wheel_leg_chassis_controller
      - rmcs_core::controller::chassis::WheelLegStateEstimator -> wheel_leg_state_estimator
      - rmcs_core::controller::chassis::WheelLegController -> wheel_leg_controller
      - rmcs_core::controller::gimbal::SimpleGimbalController -> gimbal_controller
      - rmcs_core::controller::pid::ErrorPidController -> yaw_angle_pid_controller
      - rmcs_core::controller::pid::PidController -> yaw_velocity_pid_controller
      - rmcs_core::controller::pid::ErrorPidController -> pitch_angle_pid_controller
      - rmcs_core::controller::pid::PidController -> pitch_velocity_pid_controller
      - rmcs_core::controller::gimbal::PitchGravityFeedforward -> pitch_gravity_ff
      - rmcs_core::controller::pid::PidController -> left_friction_velocity_pid_controller
      - rmcs_core::controller::pid::PidController -> right_friction_velocity_pid_controller
      - rmcs_core::controller::pid::PidController -> bullet_feeder_velocity_pid_controller
      - rmcs_core::referee::Status -> referee_status
      - rmcs_core::controller::shooting::FrictionWheelController -> friction_wheel_controller
      - rmcs_core::controller::shooting::HeatController -> heat_controller
      - rmcs_core::controller::shooting::BulletFeederController17mm -> bullet_feeder_controller

      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster
      - rmcs_rl::WheelLegMirrorComponent -> wheel_leg_mirror
      - rmcs_core::debug::ValueCollector -> value_collector

wheel_leg:
  ros__parameters:
    serial_filter_bottom_board: "AF-CBB3-7053-32C5-F3B5-B460-A786-DA9A-1FF1"
    serial_filter_top_board: "AF-46C7-7B12-9364-64F6-D95A-E4F4-9299-1B75"
    yaw_motor_zero_point: 58379
    pitch_motor_zero_point: 12637
    

    dm_master_ids: [1, 2, 1, 2]
    dm_mit_position_max: [12.5, 12.5, 12.5, 12.5]
    dm_mit_velocity_max: [45.0, 45.0, 45.0, 45.0]
    dm_mit_torque_max: [54.0, 54.0, 54.0, 54.0]
    dm_control_torque_max: [40.0, 40.0, 40.0, 40.0]

    feedback_timeout_s: 0.0


gimbal_controller:
  ros__parameters:
    upper_limit: -0.6109 # up 35 deg
    lower_limit: 0.5236 # down 30 deg

yaw_angle_pid_controller:
  ros__parameters:
    reset_interface: /chassis/reset_count
    measurement: /gimbal/yaw/control_angle_error
    control: /gimbal/yaw/control_velocity
    kp: 5.0
    ki: 0.0
    kd: 0.0

yaw_velocity_pid_controller:
  ros__parameters:
    output_min: -4.5
    output_max: 4.5
    reset_interface: /chassis/reset_count
    measurement: /gimbal/yaw/velocity_imu
    setpoint: /gimbal/yaw/control_velocity
    control: /gimbal/yaw/control_torque
    kp: 1.5
    ki: 0.0
    kd: 0.0

pitch_angle_pid_controller:
  ros__parameters:
    reset_interface: /chassis/reset_count
    measurement: /gimbal/pitch/control_angle_error
    control: /gimbal/pitch/control_velocity
    kp: 6.0
    ki: 0.0
    kd: 0.0

pitch_velocity_pid_controller:
  ros__parameters:
    output_min: -4.5
    output_max: 4.5
    reset_interface: /chassis/reset_count
    measurement: /gimbal/pitch/velocity_imu
    setpoint: /gimbal/pitch/control_velocity
    control: /gimbal/pitch/control_torque
    feedforward: /gimbal/pitch/torque_ff
    kp: 1.5
    ki: 0.0
    kd: 0.0

pitch_gravity_ff:
  ros__parameters:
    pitch_gravity_ff_gain: 0.9
    pitch_gravity_ff_phase: 0.75

friction_wheel_controller:
  ros__parameters:
    friction_wheels:
      - /gimbal/left_friction
      - /gimbal/right_friction
    friction_velocities:
      - 660.0
      - 660.0
    friction_soft_start_stop_time: 1.0

heat_controller:
  ros__parameters:
    heat_per_shot: 10000
    reserved_heat: 10000

bullet_feeder_controller:
  ros__parameters:
    bullets_per_feeder_turn: 8.0
    shot_frequency: 20.0
    safe_shot_frequency: 10.0
    eject_frequency: 10.0
    eject_time: 0.05
    deep_eject_frequency: 5.0
    deep_eject_time: 0.20
    single_shot_max_stop_delay: 2.0

left_friction_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/left_friction/velocity
    setpoint: /gimbal/left_friction/control_velocity
    control: /gimbal/left_friction/control_torque
    kp: 0.003436926
    ki: 0.0
    kd: 0.009373434

right_friction_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/right_friction/velocity
    setpoint: /gimbal/right_friction/control_velocity
    control: /gimbal/right_friction/control_torque
    kp: 0.003436926
    ki: 0.0
    kd: 0.009373434

bullet_feeder_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/bullet_feeder/velocity
    setpoint: /gimbal/bullet_feeder/control_velocity
    control: /gimbal/bullet_feeder/control_torque
    kp: 1.583
    ki: 0.0
    kd: 0.0

wheel_leg_chassis_controller:
  ros__parameters:
    vx_max: 3.0
    vx_bias: 0.0
    vy_max: 0.0
    yaw_rate_max: 4.0 # Follow-mode yaw cap only; at policy training envelope.
    spin_yaw_rate: 10.471975511965978
    yaw_stick_rate: 3.141592653589793
    following_velocity_kp: 15.0
    following_velocity_ki: 0.0
    following_velocity_kd: 0.0

    deadzone: 0.05
    angular_z_invert: false

    command_height_min: 0.23
    command_height_max: 0.42
    default_command_height: 0.334
    height_rate: 0.1

    arm_dwell_seconds: 0.0

wheel_leg_state_estimator:
  ros__parameters:
    policy: traditional
    dt: 0.001
    velocity_sign: 1.0

wheel_leg_controller:
  ros__parameters:
    dt: 0.001
    leg_kp: 160.0
    leg_kd: 2.5
    gas_spring_gain: 0.0
    max_tilt_deg: 60.0

    self_righting:
      enabled: true
      simulation_only: false
      hardware_mapping_verified: true
      fold_plant_speed_rad_s: 2.0
      insert_speed_rad_s: 2.0
      orbit_speed_rad_s: 2.0
      push_speed_rad_s: 2.0
      capture_speed_rad_s: 2.0
      side_speed_rad_s: 2.0

    motion:
      max_velocity: 5.0
      max_yaw_rate: 12.0
      channel_kp: 10.0

      velocity_accel: 1.5
      velocity_jerk: 4.0
      yaw_accel: 6.28
      yaw_jerk: 40.0
      velocity_sign: 1.0

      gravity: 9.81
      bank_to_roll_bias: 1.06
      friction_mu: 2.0
      track_width: 0.3966
      com_height: 0.26
      lat_accel_safety: 0.7

    balance:
      pitch_cutoff_hz: 30.0
      pitch_gain: 17.6
      pitch_rate_gain: 3.6
      velocity_gain: 3.0
      distance_gain: 1.0
      balance_limit: 3.69

      yaw_enabled: false
      yaw_gain: -10.8
      yaw_rate_gain: -4.3
      yaw_limit: 8.0
      yaw_sign: -1.0
      wheel_limit: 4.88

      roll_kp: -1.0
      roll_kd: -50.0
      roll_limit: 0.5

      trim_enabled: false
      trim_sign: 1.0
      trim_ki: 0.02
      trim_tau: 2.0
      trim_deadband: 0.01
      trim_limit: 0.4
      trim_pitch_limit: 1.0471975511965976
      trim_velocity_limit: 0.5

    trajectory:
      startup_settle_s: 0.0
      command_vloop_kp: 10.0
      command_vloop_kd: 2.0
      outer_kx: 0.5
      outer_kv: 0.5
      com_height: 0.26

      accel_leg_ff: 0.0
      accel_d_kp: 0.0
      accel_theta_ff: 0.0
      accel_kv: 0.0
      accel_gate_min: 0.1
      d_max: 100.0

wheel_leg_mirror:
  ros__parameters:
    enabled: true
    update_rate: 100.0

value_broadcaster:
  ros__parameters:
    update_rate: 50.0
    forward_list:
      - /chassis/tof/left/distance
      - /chassis/tof/right/distance
      - /wheel_leg/control/state
      - /wheel_leg/control/fault
      - /wheel_leg/feedback_fresh
      - /wheel_leg/dm_control_ready
      - /wheel_leg/recovery/phase
      - /wheel_leg/recovery/fault
      # 云台/发射机构遥测：只转发角度与转速，不转发力矩（torque）。
      - /gimbal/yaw/angle
      - /gimbal/yaw/velocity
      - /gimbal/pitch/angle
      - /gimbal/pitch/velocity
      - /gimbal/left_friction/velocity
      - /gimbal/right_friction/velocity
      - /gimbal/bullet_feeder/velocity

value_collector:
  ros__parameters:
    # 轮腿全过程记录（传统控制器版：无 /wheel_leg/rl/* 与自起捕获信号）
    # 1000 Hz executor，每 5 拍落一行 → 200 Hz；78 个信号 / 103 列，约 12 MB/分钟。
    csv_path: "/tmp/wheel_leg_<timestamp>.csv"
    write_interval: 5
    flush_interval: 200
    signals:
      # --- 时间基：单调时钟，单位秒 ---
      - /predefined/timestamp

      # --- 电源：四个 DM 关节共用底盘母线（DM 反馈帧只有 POS/VEL/T/T_MOS/T_Rotor，无电压字段） ---
      - /chassis/voltage
      - /chassis/supercap/voltage
      - /chassis/power

      # --- 四个驱动腿关节（DM8009） ---
      - /wheel_leg/left_hip_joint/angle
      - /wheel_leg/left_hip_joint/velocity
      - /wheel_leg/left_hip_joint/torque
      - /wheel_leg/left_hip_joint/control_torque
      - /wheel_leg/left_hip_joint/max_torque
      - /wheel_leg/left_hip_joint/temperature_mos
      - /wheel_leg/left_hip_joint/temperature_rotor
      - /wheel_leg/left_hip_joint/status_code
      - /wheel_leg/left_hip_joint/fault_code

      - /wheel_leg/left_knee_joint/angle
      - /wheel_leg/left_knee_joint/velocity
      - /wheel_leg/left_knee_joint/torque
      - /wheel_leg/left_knee_joint/control_torque
      - /wheel_leg/left_knee_joint/max_torque
      - /wheel_leg/left_knee_joint/temperature_mos
      - /wheel_leg/left_knee_joint/temperature_rotor
      - /wheel_leg/left_knee_joint/status_code
      - /wheel_leg/left_knee_joint/fault_code

      - /wheel_leg/right_hip_joint/angle
      - /wheel_leg/right_hip_joint/velocity
      - /wheel_leg/right_hip_joint/torque
      - /wheel_leg/right_hip_joint/control_torque
      - /wheel_leg/right_hip_joint/max_torque
      - /wheel_leg/right_hip_joint/temperature_mos
      - /wheel_leg/right_hip_joint/temperature_rotor
      - /wheel_leg/right_hip_joint/status_code
      - /wheel_leg/right_hip_joint/fault_code

      - /wheel_leg/right_knee_joint/angle
      - /wheel_leg/right_knee_joint/velocity
      - /wheel_leg/right_knee_joint/torque
      - /wheel_leg/right_knee_joint/control_torque
      - /wheel_leg/right_knee_joint/max_torque
      - /wheel_leg/right_knee_joint/temperature_mos
      - /wheel_leg/right_knee_joint/temperature_rotor
      - /wheel_leg/right_knee_joint/status_code
      - /wheel_leg/right_knee_joint/fault_code

      # --- 两个驱动轮（DJI） ---
      - /wheel_leg/left_wheel/angle
      - /wheel_leg/left_wheel/velocity
      - /wheel_leg/left_wheel/torque
      - /wheel_leg/left_wheel/control_torque
      - /wheel_leg/left_wheel/max_torque
      - /wheel_leg/left_wheel/temperature_c

      - /wheel_leg/right_wheel/angle
      - /wheel_leg/right_wheel/velocity
      - /wheel_leg/right_wheel/torque
      - /wheel_leg/right_wheel/control_torque
      - /wheel_leg/right_wheel/max_torque
      - /wheel_leg/right_wheel/temperature_c

      # --- 状态估计（机体） ---
      - /wheel_leg/state/position
      - /wheel_leg/state/velocity
      - /wheel_leg/state/gravity
      - /wheel_leg/state/attitude
      - /wheel_leg/state/passive_knee
      - /wheel_leg/state/passive_knee_rate
      - /wheel_leg/state/shank
      - /wheel_leg/state/shank_rate
      - /wheel_leg/state/leg_length
      - /wheel_leg/state/forward_velocity
      - /wheel_leg/state/com_offset
      - /wheel_leg/state/base_height
      - /wheel_leg/state/valid

      # --- IMU ---
      - /wheel_leg/imu/quaternion
      - /wheel_leg/imu/angular_velocity

      # --- 传统控制器 / 自起 / 硬件诊断 / 底盘指令 ---
      - /wheel_leg/control/state
      - /wheel_leg/control/fault
      - /wheel_leg/recovery/phase
      - /wheel_leg/recovery/fault
      - /wheel_leg/feedback_fresh
      - /wheel_leg/feedback_available
      - /wheel_leg/dm_control_ready
      - /wheel_leg/dr16_fresh
      - /chassis/control_height
      - /chassis/control_enable
      - /chassis/reset_count
