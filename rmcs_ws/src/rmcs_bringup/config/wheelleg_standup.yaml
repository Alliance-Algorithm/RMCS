# Self-righting stand-up demo: MuJoCo plant + the V5.0 self-righting controller
# (no motion planner / trajectory / ADRC). The controller copies the RL recovery
# state machine (rmcs_rl) into the reduced sagittal model:
#   idle -> SELECT -> FOLD -> PLANT -> PREPARE -> BLEND -> DONE
# (upside down)      -> FOLD -> ORBIT -> THRUST -> CAPTURE -> PREPARE -> ...
# The wheels are balanced with the RL script's pitch law, not ADRC.
#
# Run:  ros2 launch rmcs_bringup rmcs.launch.py robot:=wheelleg_standup
rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
    - rmcs_core::hardware::WheelLegSimulation -> wheelleg_sim
    - rmcs_core::controller::wheelleg::WheelLegStandupController -> wheelleg_standup

wheelleg_sim:
  ros__parameters:
    dt: 0.001
    initial_height: 0.392
    # Start pose: the sim's own self-consistent standing pose. The controller is
    # told to run the RL FOLD -> PLANT -> PREPARE sequence from here (start_phase:
    # fold), which is inside the RL recovery's design domain.
    initial_pose: standing
    fix_base: false
    fix_base_planar: false
    fix_base_hold_z: false
    hip_kp: 250.0
    hip_kd: 6.0
    crank_kp: 150.0
    crank_kd: 2.0
    wheel_kp: 20.0
    gravity_feedforward: true
    joint_damping: 0.25
    hip_armature: 0.005
    leg_frictionloss: 1.05
    constraint_timeconst: 0.002
    constraint_dampratio: 1.0
    hip_torque_limit: 40.0
    crank_torque_limit: 40.0
    wheel_torque_limit: 4.88
    thigh_length: 0.21
    shank_length: 0.25005
    # V5.0 convention confirmed against the frozen V6 recovery profile: the
    # reduced hip equals the raw L_joint1, so the bridge mapping is the identity
    # (the previous hip_sign=-1/hip_zero=pi flipped the legs and prevented
    # standing).
    hip_sign: 1.0
    hip_zero: 0.0
    knee_zero_l: 1.8325957145940461
    knee_zero_r: 1.8325957145940461
    knee_limit_min: 0.6981317007977318
    knee_limit_max: 1.9198621771937625
    knee_hard_stop: true
    wheel_dir: 1.0
    state_pitch_sign: 1.0
    state_shank_sign: 1.0
    state_knee_sign: 1.0
    state_hip_sign: 1.0
    state_wheel_sign: 1.0
    state_yaw_sign: 1.0
    viewer: true
    viewer_state_rate: 100.0
    viewer_track_body: base_link
    viewer_follow: false
    viewer_distance: 2.5
    viewer_azimuth: 90.0
    viewer_elevation: -20.0
    state_topic: /wheelleg/simulation/state
    lock_leg: false
    gravity_ff_analytic: false
    # Nitrogen gas spring (BKB0.45-080-205).
    gas_spring_enabled: true
    gas_spring_sign: 1.0
    gas_spring_full_extension: 0.232
    gas_spring_stroke: 0.08
    gas_spring_c0: 280.0
    gas_spring_c2: 122.7359
    gas_spring_c3: 53.9698
    disturbance_force: 0.0
    disturbance_start: -1.0
    disturbance_duration: 0.0
    open_loop_wheel_torque: .nan
    open_loop_wheel_same_sign: true

wheelleg_standup:
  ros__parameters:
    dt: 0.001
    backend: simulation
    # Start on boot: false = hold the initial pose so it can be inspected; set
    # true (or publish /wheelleg/standup/trigger) to run the recovery sequence.
    start_on_boot: true
    # auto | fold | lower | prepare: force the first phase. "fold" runs the RL
    # FOLD -> PLANT -> PREPARE sequence from the sim's standing start.
    start_phase: fold
    trigger_topic: /wheelleg/standup/trigger
    # Geometry / mass (match wheelleg_sim.yaml / the MJCF).
    thigh_length: 0.21
    shank_length: 0.25005
    body_mass: 11.62
    thigh_mass: 0.426
    shank_mass: 0.507
    thigh_com_offset: 0.06623
    shank_com_offset: 0.15344
    body_com_offset: 0.00918
    # Recovery poses (reduced convention: hip == raw L_joint1, beta == interior
    # knee). Defaults are the frozen V6 recovery profile
    # (rmcs_rl/models/wheel_leg/deployment/v6_recovery_profiles_v1.json).
    fold_hip: -0.252107
    fold_beta: 0.872665          # 50.000 deg
    nominal_hip: -0.42
    nominal_beta: 1.184289       # 67.855 deg
    thrust_hip: -0.749367
    thrust_beta: 1.658063        # 95.000 deg
    support_hip: -0.42           # == nominal
    support_beta: 1.184289
    # "Lower the legs" first phase (chassis grounded, legs up). The thigh starts
    # pointing UP (motor_zero hip = +1.648); to get the leg UNDER the body it
    # must rotate ~180 deg to point DOWN (hip ~= +1.648 - pi = -1.493). Using the
    # standing value -0.42 here leaves the leg horizontal-forward, so it only
    # shoves the chassis and the (unloaded) wheels just roll. Try -1.493; if the
    # leg swings the wrong way, use the other branch +4.790.
    lower_hip: -1.493
    lower_beta: 1.832596         # 105 deg (near full extension)
    lower_speed: 0.6
    lower_min_seconds: 0.5
    # Hold (brake) the wheels during kLower so the leg swing pivots the body
    # over the axle instead of free-rolling the base (Nm per rad/s). 0 = free.
    lower_brake_kp: 20.0
    # Reference speeds (rad/s), from the native V6 JointReferenceRecoveryConfig
    # (prepare/push = 1.0/4.0 rad/s).
    fold_speed: 1.0
    plant_speed: 1.0
    orbit_speed: 4.0
    thrust_speed: 4.0
    prepare_speed: 1.0
    capture_speed: 4.0
    blend_seconds: 0.2
    plant_angle_rad: 0.3490658503988659   # 20 deg
    # Route selection and dwell times.
    stand_tilt_deg: 15.0
    stand_height: 0.20
    plant_tilt_deg: 70.0
    fold_min_seconds: 0.3
    plant_contact_seconds: 0.06
    plant_timeout: 2.5
    orbit_turns: 1.0
    orbit_contact_angle: 3.7
    handover_seconds: 0.1
    handover_tilt_deg: 8.0
    # Base height window (our bridge reports the base origin z; standing is
    # ~0.33-0.39 m, chassis-grounded start ~0.17 m).
    handover_height_min: 0.25
    handover_height_max: 0.45
    # Wheel pitch balance (their `efforts_` pitch law; no ADRC).
    balance_tilt_deg: 55.0
    pitch_kp: 8.0
    pitch_kd: 1.5
    wheel_damping: 0.2
    wheel_torque_limit: 4.88
    wheel_axis_sign: 1.0
    contact_force_eps: 1.0
    target_wheel_velocity: 0.0
    # Hardware mapping (only used when backend: hardware), per side [left, right].
    # Defaults from the real (V6) calibration v6_pair_from_dev_rmcs_rl.json:
    # left hip zero -pi/2, right hip zero +pi/2; hip sign -1 / +1; crank sign -1.
    hardware_hip_sign: [-1.0, 1.0]
    hardware_hip_zero: [-1.5707963267948966, -1.5707963267948966]
    hardware_crank_sign: [-1.0, 1.0]
