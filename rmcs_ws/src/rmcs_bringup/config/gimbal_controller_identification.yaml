# Big-yaw identification: pulse -> sine chirp -> constant -> linear.
# Each pass lasts 67.9 s, using the small-yaw identification sequence.
# A second complete pass mirrors the torque sign; total duration is 135.8 s.
# Pulses: 2/3.5/5/6 Nm, +--+ at every level, 0.20 s on / 0.70 s rest.
# Sine: 4 Nm, 0.30 -> 1.20 Hz, 16 s. Constant: +/-3 Nm, 2 s each.
# Linear: two groups of 0 -> +3.5 -> 0 -> -3.5 -> 0, 4 s per leg.
# Joint2 lift is disabled. Small yaw holds the relative angle captured on unlock
# using sliding control. Double-down confirmation and centered unlock start the
# run automatically. Big-yaw speed limit: 10 rad/s.
# Completion/fault requires double-down to rearm.
# The service automatically records scalar topics and the atomic CAN diagnostic sample.
rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
    - rmcs_core::hardware::GimbalFeedbackTest -> gimbal_feedback_test
    - rmcs_core::hardware::GimbalBigYawTorqueTest -> gimbal_big_yaw_torque_test
    - rmcs_core::controller::gimbal::GimbalControllerTest -> gimbal_controller_test
    - rmcs_core::controller::robust::RobustController -> big_yaw_robust_shadow_controller
    - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster
