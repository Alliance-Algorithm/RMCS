rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::AdjustableHeavy -> heavy

      - rmcs_core::controller::chassis::SteeringWheelController -> steering_wheel_controller
      - rmcs_core::controller::chassis::HeavyStabilizingController -> heavy_stabilizing_controller


heavy:
  ros__parameters:
    board_serial_chassis_board: ""
    steering_left_front_zero_point: 0
    steering_left_back_zero_point: 0
    steering_right_back_zero_point: 0
    steering_right_front_zero_point: 0

steering_wheel_controller:
  ros__parameters:
    mess: 35.0
    moment_of_inertia: 2.0
    vehicle_radius: 0.3238
    wheel_radius: 0.055
    friction_coefficient: 0.7
    k1: 2.958580e+00
    k2: 3.082190e-03
    no_load_power: 15.37

heavy_stabilizing_controller:
  ros__parameters:
    # Terms: pid, zero_torque.
    controller_list: [pid]

    master_pos_kp: 10.0
    master_pos_ki: 0.0
    master_pos_kd: 0.0
    master_pos_output_min: -10.0
    master_pos_output_max: 10.0
    master_vel_kp: 0.05
    master_vel_ki: 0.0
    master_vel_kd: 0.0

    slave_pos_kp: 10.0
    slave_pos_ki: 0.0
    slave_pos_kd: 0.0
    slave_pos_output_min: -10.0
    slave_pos_output_max: 10.0
    slave_vel_kp: 0.05
    slave_vel_ki: 0.0
    slave_vel_kd: 0.0
