rmcs_executor:
  ros__parameters:
    # Overlay for wheelleg_sim.yaml: pass this as a *second* --params-file.
    # It re-lists the components (list params are replaced whole by rclcpp) and
    # adds the CSV probe. `wheelleg_sim.yaml` still supplies all tuning.
    components:
    - rmcs_core::hardware::WheelLegSimulation -> wheelleg_sim
    - rmcs_core::controller::wheelleg::WheelLegMotionPlanner -> wheelleg_motion_planner
    - rmcs_core::controller::wheelleg::WheelLegTrajectoryController -> wheelleg_trajectory_controller
    - rmcs_core::controller::adrc::AdrcController -> wheelleg_balance_controller
    - rmcs_core::controller::adrc::AdrcController -> wheelleg_yaw_controller
    - rmcs_core::controller::pid::ErrorPidController -> wheelleg_roll_controller
    - rmcs_core::controller::wheelleg::WheelLegWheelMixer -> wheelleg_wheel_mixer
    - rmcs_core::debug::ValueCollector -> wheelleg_probe
wheelleg_probe:
  ros__parameters:
    csv_path: /tmp/opencode/wheelleg_phase0.csv
    write_interval: 1
    flush_interval: 1000
    signals:
    - /wheelleg/state/wheel_torque_l
    - /wheelleg/state/wheel_torque_r
    - /wheelleg/state/friction_torque_limit_l
    - /wheelleg/state/friction_torque_limit_r
    - /wheelleg/state/friction_utilization_l
    - /wheelleg/state/friction_utilization_r
    - /wheelleg/state/contact_normal_l
    - /wheelleg/state/contact_normal_r
    - /wheelleg/state/slip_l
    - /wheelleg/state/slip_r
    - /wheelleg/state/velocity
    - /wheelleg/state/pitch
    - /wheelleg/state/distance
