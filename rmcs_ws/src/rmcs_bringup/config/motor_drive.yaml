rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::MotorDrive -> motor_hardware
      - rmcs_core::controller::pid::PidController -> motor_velocity_pid
      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

motor_hardware:
  ros__parameters:
    board_serial: ""
    velocity_max: 2.0
    fixed_velocity: 0.0
    square_wave: false
    square_low: 0.0
    square_high: 2.0
    square_period: 0.5   
    filter_alpha: 0.14

motor_velocity_pid:
  ros__parameters:
    measurement: /motor/velocity
    setpoint: /motor/control_velocity
    control: /motor/control_torque
    kp: 0.42
    ki: 0.002
    kd: 0.0
    output_min: -3.0
    output_max: 3.0

value_broadcaster:
  ros__parameters:
    forward_list:
      - /motor/control_velocity
      - /motor/velocity
      - /motor/velocity_filtered
      - /motor/control_torque
