rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::Dm_motor_test -> dm_motor_test

dm_motor_test:
  ros__parameters:
    # ---- 板子 ----
    board_serial: "AF-8AE3-4EC1-03C3-C494-88FE-2DC4-3018-0298"   # 板子 USB 序列号子串过滤（空 = 匹配任意板子）

    # ---- 电机（LK MG4010Ei10, can0, ID=1）----
    motor_id: 1                   # LK 电机 ID → 帧 ID = 0x140 + id = 0x141（命令/反馈同 ID）
    encoder_zero_point: 0         # 编码器零点（LK 上位机标定后填入，也可用代码校准）
    motor_reversed: false         # 反接时为 true
    multi_turn_angle: true        # 位置模式用多圈角度

    # ---- DR16 遥控控制（SWA=左开关, SWD=右开关）----
    # 双下=失能，其余=使能；双中=位置(角度+限速)、左上右中=速度、左中右上=扭矩(MIT)
    position_scale: 3.0           # 双中：左摇杆 X → 目标角度 ±rad
    velocity_scale: 5.0           # 速度满行程 ±rad/s（双中限速 / 速度模式目标速度）
    torque_scale: 4.5             # 扭矩(MIT)模式：右摇杆满行程 ±Nm（4010i10 峰值 4.5Nm）
    velocity_torque_limit: 4.5    # 速度模式扭矩限幅 [Nm]
    log_rate: 1.0                 # 中间数值日志频率 [Hz]
