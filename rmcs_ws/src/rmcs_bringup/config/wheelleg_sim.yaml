rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
    - rmcs_core::hardware::WheelLegSimulation -> wheelleg_sim
    - rmcs_core::controller::wheelleg::WheelLegMotionPlanner -> wheelleg_motion_planner
    - rmcs_core::controller::wheelleg::WheelLegTrajectoryController -> wheelleg_trajectory_controller
    - rmcs_core::controller::adrc::AdrcController -> wheelleg_balance_controller
    - rmcs_core::controller::adrc::AdrcController -> wheelleg_yaw_controller
    - rmcs_core::controller::pid::ErrorPidController -> wheelleg_roll_controller
    - rmcs_core::controller::wheelleg::WheelLegWheelMixer -> wheelleg_wheel_mixer
    - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster
value_broadcaster:
  ros__parameters:
    update_rate: 100.0
    forward_list:
      # plant / estimated state
      - /wheelleg/state/pitch
      - /wheelleg/state/pitch_velocity
      - /wheelleg/state/roll
      - /wheelleg/state/roll_rate
      - /wheelleg/state/yaw
      - /wheelleg/state/yaw_rate
      - /wheelleg/state/base_height
      - /wheelleg/state/leg_length
      - /wheelleg/state/leg_angle
      - /wheelleg/state/knee_angle
      - /wheelleg/state/knee_velocity
      - /wheelleg/state/shank_angle
      - /wheelleg/state/shank_velocity
      - /wheelleg/state/com_offset
      - /wheelleg/state/wheel_velocity
      - /wheelleg/state/velocity
      # references / commands
      - /wheelleg/reference/pitch
      - /wheelleg/reference/hip_angle
      - /wheelleg/reference/knee_angle
      - /wheelleg/reference/shank_angle
      - /wheelleg/reference/wheel_velocity
      - /wheelleg/command/velocity
      - /wheelleg/command/leg_length
      - /wheelleg/command/yaw
      - /wheelleg/command/yaw_rate
      - /wheelleg/command/roll_error
      # controller outputs
      - /wheelleg/control/wheel_torque
      - /wheelleg/control/wheel_torque_diff
      - /wheelleg/control/wheel_torque_l
      - /wheelleg/control/wheel_torque_r
      - /wheelleg/control/roll_bias
      # balance ADRC internals (u = applied torque, z3 = estimated disturbance)
      - /wheelleg_balance_controller/debug/measurement
      - /wheelleg_balance_controller/debug/reference
      - /wheelleg_balance_controller/debug/e1
      - /wheelleg_balance_controller/debug/e2
      - /wheelleg_balance_controller/debug/z1
      - /wheelleg_balance_controller/debug/z2
      - /wheelleg_balance_controller/debug/z3
      - /wheelleg_balance_controller/debug/u0
      - /wheelleg_balance_controller/debug/u
      # yaw ADRC internals
      - /wheelleg_yaw_controller/debug/measurement
      - /wheelleg_yaw_controller/debug/reference
      - /wheelleg_yaw_controller/debug/e1
      - /wheelleg_yaw_controller/debug/e2
      - /wheelleg_yaw_controller/debug/z1
      - /wheelleg_yaw_controller/debug/z2
      - /wheelleg_yaw_controller/debug/z3
      - /wheelleg_yaw_controller/debug/u0
      - /wheelleg_yaw_controller/debug/u
      - /wheelleg/balance/enable
      - /wheelleg/state/contact_normal_l
      - /wheelleg/state/contact_normal_r
wheelleg_sim:
  ros__parameters:
    dt: 0.001
    initial_height: 0.392
    # Start pose for the self-righting test: `motor_zero` = chassis grounded,
    # legs/wheels up (the get-up start). Use `standing` for the normal driving
    # demo.
    initial_pose: standing
    initial_pose_height: 0.173
    fix_base: false
    fix_base_planar: false
    fix_base_hold_z: false
    # Leg PD from the real-robot (V6/RL) identification config:
    # prepare_kp=160, prepare_kd=2.5 on all four leg drives. In simulation this
    # stands in for the real motor driver's PD.
    hip_kp: 160.0
    hip_kd: 2.5
    crank_kp: 160.0
    crank_kd: 2.5
    wheel_kp: 20.0
    gravity_feedforward: true
    # Leg joint viscous damping. 0.1 leaves a sustained leg limit cycle (hip/crank
    # ~2-3 deg plus a high-freq buzz); 0.3 fully damps it with no change to the
    # equilibrium. Real gas-spring seals/bearings add friction, so the higher
    # value is also more physical.
    joint_damping: 0.25
    hip_armature: 0.005
    # Leg Coulomb friction (common-mode identification: 2.11 Nm common ->
    # ~1.05 Nm per driven hip/crank joint). Driven joints only.
    leg_frictionloss: 1.05
    # Wheel joint dynamics from the real-robot identification (wheels-r15p62):
    # reflected M3508/gearbox inertia (armature), bearing viscous damping and
    # Coulomb frictionloss, all at the wheel output shaft. NOT joint_damping.
    #   J:   left 0.00504 / right 0.00451 kg*m^2   -> armature ~4.7e-3
    #   vis: left ~5e-4  / right ~1.2e-3 Nm*s/rad  -> ~1e-3
    #   coul:left ~0.064 / right ~0.118 Nm         -> ~9e-2
    wheel_armature: 0.0047
    wheel_joint_damping: 0.001
    wheel_frictionloss: 0.09
    # Wheel motor speed limit at the output shaft [rad/s] (M3508 rated ~469 rpm
    # => 49.1). Accelerating torque tapers to zero near the limit; 0 disables.
    wheel_speed_limit: 49.1
    constraint_timeconst: 0.002
    constraint_dampratio: 1.0
    hip_torque_limit: 40.0
    crank_torque_limit: 40.0
    # Wheel output-shaft torque limit [Nm]. The sim applies torque directly at
    # the output joint (no gearbox modelled), so this is the real DjiMotor
    # output limit (max_torque ≈ 4.88 Nm at 20 A).
    wheel_torque_limit: 4.88
    thigh_length: 0.21
    shank_length: 0.25005
    hip_sign: -1.0
    hip_zero: 3.14159265358979
    # Motor zero: knee interior angle 105 deg (real-robot encoder zero), thigh
    # perpendicular to chassis.
    knee_zero_l: 1.8325957145940461
    knee_zero_r: 1.8325957145940461
    # Mechanical knee limits (interior thigh-shank angle), hard: 40..105 deg.
    knee_limit_min: 0.6981317007977318
    knee_limit_max: 1.8325957145940461
    knee_hard_stop: true
    wheel_dir: 1.0
    state_pitch_sign: 1.0
    state_shank_sign: 1.0
    state_knee_sign: -1.0
    state_wheel_sign: 1.0
    state_yaw_sign: 1.0
    viewer: true
    viewer_state_rate: 100.0
    viewer_track_body: base_link
    viewer_follow: false
    viewer_distance: 2.5
    viewer_azimuth: 90.0
    viewer_elevation: -20.0
    state_topic: /wheelleg/simulation/state
    lock_leg: false
    gravity_ff_analytic: false
    # Nitrogen gas spring (BKB0.45-080-205, 10 MPa): modelled as a force along
    # the two pin anchors (thigh/shank). N(u) = c0 + c2*u^2 + c3*u^3 [N], u is
    # the compression u = full_extension - pin_distance, clamped to [0, stroke].
    # gas_spring_sign flips the push direction; run once and check whether the
    # robot is pushed up (leg extends) or down, then set the sign.
    gas_spring_enabled: true
    gas_spring_sign: 1.0
    gas_spring_full_extension: 0.232
    gas_spring_stroke: 0.08
    gas_spring_c0: 280.0
    gas_spring_c2: 122.7359
    gas_spring_c3: 53.9698
    disturbance_force: 0.0
    disturbance_start: -1.0
    disturbance_duration: 0.0
    open_loop_wheel_torque: .nan
    open_loop_wheel_same_sign: true
wheelleg_motion_planner:
  ros__parameters:
    dt: 0.001
    # twist (default): follow /wheelleg/move/velocity + /wheelleg/move/yaw_rate
    # square / patrol: commissioning test behaviours (below)
    # twist with no /wheelleg/move/* publisher = idle, the robot just stands.
    behavior: twist
    max_velocity: 5.0
    # Prescribed forward direction sign vs the chassis geometry (mirrored on the
    # real robot): a positive command maps to velocity_sign * velocity.
    velocity_sign: -1.0
    max_yaw_rate: 12.0
    channel_kp: 10.0
    velocity_accel: 1.5
    velocity_jerk: 4.0
    yaw_accel: 6.28
    yaw_jerk: 40.0
    # Nominal stance length, matching the STAND chain / trajectory controller's
    # nominal_leg_length (the recovery hands off to this).
    leg_length: 0.334
    # behavior: square
    command_velocity_start: 3.0
    command_velocity: 0.0
    command_velocity_switch: 5.0
    command_velocity_2: 0.0
    command_velocity_period: 5.0
    command_yaw_rate: 6.28
    command_yaw_rate_start: 3.0
    command_yaw_rate_period: 0.0
    # behavior: patrol
    patrol_velocity: 3.0
    patrol_straight_time: 5.0
    patrol_yaw_rate: 3.14
    patrol_yaw_accel: 6.28
    patrol_turn_degrees: 180.0
    patrol_start: 3.0
    patrol_yaw_sign: 1.0
    # behavior: circle (combined translation + turning: radius v/omega)
    circle_velocity: 2.0
    circle_yaw_rate: 1.0
    circle_start: 3.0
    # behavior: stadium (oval track: straight 3 m/s, 180deg arc at 2 m/s
    # centreline speed = moving turn, radius v_arc/omega_arc = 2 m)
    stadium_straight_velocity: 3.3
    stadium_straight_time: 5.0
    stadium_arc_velocity: 2.5
    stadium_arc_yaw_rate: 1.0
    stadium_start: 3.0
    stadium_yaw_sign: 1.0
    # lateral bank plan: a_lat = v*omega -> bank = atan(a_lat/g); the leg-length
    # differential feedforward roll_bias_ff = bank_to_roll_bias * bank
    # (bank_to_roll_bias = 1/(open-loop static gain roll/roll_bias ~ 0.9),
    # tuned to ~2.11 so the PD roll stabiliser's steady opposition is cancelled).
    gravity: 9.81
    bank_to_roll_bias: 1.06
    # Feasible lateral accel: min(mu*g [friction], g*w/(2h) [tip-over, the
    # per-wheel normal force staying positive]) times a safety factor.
    # lat_accel_max > 0 is an optional extra hard cap (0 = auto/physical).
    friction_mu: 2.0
    # Wheel track from our own URDF (L_link3 <-> R_link3 lateral distance at the
    # assembly pose = 0.3966 m). Used by the lateral tip-over limit
    # a_lat <= g*w/(2h). (The real-robot RL config uses 0.4373 for its V6 chassis;
    # keep ours model-consistent.)
    track_width: 0.3966
    com_height: 0.26
    lat_accel_safety: 0.7
    lat_accel_max: 0.0
wheelleg_trajectory_controller:
  ros__parameters:
    dt: 0.001
    thigh_length: 0.21
    shank_length: 0.25005
    wheel_radius: 0.06
    nominal_leg_length: 0.334
    body_mass: 11.62
    thigh_mass: 0.426
    shank_mass: 0.507
    thigh_com_offset: 0.06623
    shank_com_offset: 0.15344
    body_com_offset: 0.00918
    knee_branch_sign: -1.0
    # Hard knee limits in the controller's signed convention (beta = -interior):
    # interior 40..110 deg => beta -110..-40 deg.
    knee_angle_min: -1.8325957145940461
    knee_angle_max: -0.6981317007977318
    d_max: 100.0
    # Contact gate for the static-stability guard (wheel normal force above which
    # the wheel counts as loaded). Only used when contact_normal_* is wired.
    contact_normal_eps: 1.0
    balance_velocity_kp: 0.0
    balance_position_kp: 0.0
    balance_integral_limit: 5.0
    # Balance ADRC enable gate: enabled only while the wheels carry the body and
    # |pitch| is below this (near-upright standing hold).
    gravity: 9.81
    leg_motion_coupling: 0.0
    outer_kx: 0.5
    outer_kv: 0.5
    com_height: 0.26
    accel_leg_ff: -0.909
    accel_d_kp: -0.5
    accel_theta_ff: 3.85
    accel_kv: 2.0
    posture_yaw_scale: 0.15
    command_accel_limit: 1.5
    command_jerk_limit: 4.0
    command_vloop_kp: 10.0
    command_vloop_kd: 2.0
# --- self-righting / get-up source: DISABLED for the stand test ---
# The sim now exercises the STANDING / balance chain only
# (motion_planner -> trajectory -> balance/yaw/roll -> wheel_mixer) from
# `initial_pose: standing`, with no /wheelleg/task/* producer (the trajectory
# then runs the balance branch, alpha_r = 1). To re-enable the get-up, add
#   - rmcs_core::controller::wheelleg::WheelLegRecoveryController -> wheelleg_recovery
# back to `components` and restore the wheelleg_recovery block from git history.
wheelleg_balance_controller:
  ros__parameters:
    measurement: /wheelleg/state/pitch
    setpoint: /wheelleg/reference/pitch
    control: /wheelleg/control/wheel_torque
    enable: /wheelleg/balance/enable
    debug: true
    dt: 0.001
    b0: 5.0
    kt: 2.0
    td_h: 0.001
    td_r: 50.0
    eso_w0: 300.0
    eso_auto_beta: true
    k1: 400.0
    k2: 100.0
    alpha1: 0.75
    alpha2: 0.7
    delta: 0.02
    feedforward: /wheelleg/balance/feedforward
    u_min: -4.88
    u_max: 4.88
    output_min: -4.88
    output_max: 4.88
wheelleg_yaw_controller:
  ros__parameters:
    measurement: /wheelleg/state/yaw
    setpoint: /wheelleg/command/yaw
    control: /wheelleg/control/wheel_torque_diff
    dt: 0.001
    b0: 2.32
    kt: 1.0
    td_h: 0.001
    td_r: 50.0
    eso_w0: 50.0
    eso_auto_beta: false
    eso_beta1: 150.0
    eso_beta2: 7500.0
    eso_beta3: 0.0
    # omega_c ~ 5 rad/s: the original k1=k2=2 (~1.4 rad/s) only tracked a steady
    # spin but lagged a 1 rad/s arc ramp, dragging out the turns. Startup chatter
    # stays low at this gain (k1~100 excited the drop transient).
    k1: 25.0
    k2: 10.0
    alpha1: 0.75
    alpha2: 0.7
    delta: 0.02
    u_min: -8.0
    u_max: 8.0
    output_min: -8.0
    output_max: 8.0
wheelleg_wheel_mixer:
  ros__parameters:
    yaw_sign: -1.0
    wheel_torque_limit: 4.88
wheelleg_roll_controller:
  ros__parameters:
    # Lateral/bank: a differential-leg-length feedforward banks the body to the
    # planned bank; the PD acts on the tracking error (roll - bank), so at steady
    # state it adds nothing and does not fight the bank (no FF/PD rebalancing).
    measurement: /wheelleg/command/roll_error
    feedforward: /wheelleg/command/roll_bias_ff
    control: /wheelleg/control/roll_bias
    kp: -1.0
    ki: 0.0
    kd: -50.0
    integral_min: -0.5
    integral_max: 0.5
    integral_split_min: -1.0
    integral_split_max: 1.0
    output_min: -0.5
    output_max: 0.5