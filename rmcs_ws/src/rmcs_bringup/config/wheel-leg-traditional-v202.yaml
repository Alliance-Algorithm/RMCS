# Supervised traditional v2.0.2 commissioning: self-right -> zero-command stand.
# Native recovery and standing cores match the 2026-11-03 Isaac tests.
# Hardware commissioning is explicitly enabled; physical validation is pending.
# Fully inverted recovery remains unqualified (impact/axis-overspeed failure).
# Fresh both-DOWN >=1 s -> both-MIDDLE (zero recovery effort) -> left-MIDDLE/right-UP.
# Commands stay v=0, yaw_rate=0, length=0.334 m; joystick and knob are ignored.
# Hardware does the sole IMU mounting transform before the EKF: raw (-x,y,-z).
# IMU position is unmeasured: zero disables lever-arm correction.
# API -> CAD: q_CAD = sign * (q_API - hardware_zero_rad).
# Reuse current RMCS calibration110; no drive set-zero is performed.
# No referee UART: the 150 W model ceiling is an uncalibrated local estimate.
# This graph opens the real board only when launched by the operator.
# ros2 launch rmcs_bringup rmcs.launch.py robot:=wheel-leg-traditional-v202
